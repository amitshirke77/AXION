# One-click deploy on Render: Dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: action-tracker
    runtime: node
    plan: starter            # paid plan needed for the persistent disk below
    region: singapore        # closest Render region to India
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: tracker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        value: amit.shirke@zipstacc.com
      - key: ADMIN_PASSWORD      # first sign-in password for the admin; change it after signing in
        sync: false
      # Microsoft sign-in (optional; see README)
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_TENANT
        value: organizations
      # Email (optional; see README)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
