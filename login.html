<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · AXION</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f5f5f7;--surface:#fff;--ink:#1d1d1f;--muted:#6e6e73;--faint:#8e8e93;--fill:rgba(118,118,128,.12);--line:rgba(60,60,67,.14);--primary:#0071e3;--primary-h:#0077ed;--red:#d70015;--red-bg:rgba(255,59,48,.10);--green:#248a3d;--green-bg:rgba(52,199,89,.14);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#a1a1a6;--faint:#8e8e93;--fill:rgba(118,118,128,.24);--line:rgba(84,84,88,.6);--primary:#0a84ff;--primary-h:#409cff;--red:#ff453a;--red-bg:rgba(255,69,58,.18);--green:#30d158;--green-bg:rgba(48,209,88,.16);color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.47;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right))}
.card{width:min(400px,100%);background:var(--surface);border-radius:22px;padding:34px 30px 28px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:16px}
h1{font-size:28px;font-weight:700;letter-spacing:-.028em;margin:0;line-height:1.15}
.sub{color:var(--muted);margin:-8px 0 4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
input{font:inherit;color:inherit;border:0;background:var(--fill);border-radius:12px;padding:12px 14px;outline:none;font-size:16px}
input:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 35%,transparent)}
button{font:inherit;border:0;border-radius:999px;padding:12px 18px;cursor:pointer;font-weight:600;font-size:15px}
.pri{background:var(--primary);color:#fff}.pri:hover{background:var(--primary-h)}
.ms{background:var(--fill);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px}
.ms:hover{background:color-mix(in srgb,var(--fill) 100%,var(--ink) 6%)}
button[disabled]{opacity:.5;cursor:wait}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.link{background:none;color:var(--primary);padding:0;font-weight:500;font-size:14px;align-self:center}
.msg{border-radius:12px;padding:10px 14px;font-size:14px}
.msg.err{background:var(--red-bg);color:var(--red)}.msg.ok{background:var(--green-bg);color:var(--green)}
.foot{color:var(--faint);font-size:12px;text-align:center}
.disc{color:var(--faint);font-size:11px;line-height:1.45;text-align:center;margin:2px 0 0;border-top:1px solid var(--line);padding-top:12px}
.hero{margin:-34px -30px 6px;border-radius:22px 22px 0 0;background:#182432;display:flex;justify-content:center;padding:22px 20px 16px}
.hero img{display:block;height:170px;width:auto;max-width:100%}
.mono{display:block;width:52px;height:52px;border-radius:12px;margin-bottom:-4px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}
</style>
</head>
<body>
<main class="card" id="card" aria-live="polite"></main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const DISC = `<p class="disc">Internal, non-commercial tool. Not a commercial product. “AXION” is an internal name only and is not intended to infringe any trademark, trade name or copyright.</p>`;
const h = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = async (url, body) => {
  const r = await fetch(url, { method: body ? "POST" : "GET", headers: { "content-type": "application/json", "x-tracker": "1" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong. Try again.");
  return j;
};
const MS_ICON = '<svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>';
let CFG = { msEnabled: false, mailEnabled: false };
function msgHTML(text, kind) { return text ? `<div class="msg ${kind}">${h(text)}</div>` : ""; }

function loginView(err, ok) {
  $("#card").innerHTML = `<div class="hero"><img src="/logo.png" alt="AXION · Action item tracker" width="181" height="170"></div><h1 class="sr">Sign in to AXION</h1>${msgHTML(err, "err")}${msgHTML(ok, "ok")}
    ${CFG.msEnabled ? `<button class="ms" id="msBtn" type="button">${MS_ICON}Sign in with Microsoft</button><div class="or">or use your email</div>` : ""}
    <form id="f" style="display:flex;flex-direction:column;gap:14px">
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
      <button class="pri" id="go" type="submit">Sign in</button>
    </form>
    <button class="link" id="forgot" type="button">Forgot password?</button>
    <p class="foot">Access is by invitation. Ask Amit if you need an account.</p>${DISC}`;
  if (CFG.msEnabled) $("#msBtn").onclick = () => { location.href = "/auth/microsoft"; };
  $("#f").onsubmit = async (e) => {
    e.preventDefault(); $("#go").disabled = true;
    const em = $("#email").value.trim();
    try { await api("/api/auth/login", { email: em, password: $("#pw").value }); location.href = "/" + (location.hash || ""); }
    catch (x) { loginView(x.message); $("#email").value = em; $("#pw").focus(); }
  };
  $("#forgot").onclick = forgotView;
  setTimeout(() => $("#email") && $("#email").focus(), 30);
}
function forgotView() {
  $("#card").innerHTML = `<img class="mono" src="/monogram.png" alt="AXION" width="52" height="52"><h1>Reset password</h1><p class="sub">We'll email you a link to set a new password.</p>
    <form id="f" style="display:flex;flex-direction:column;gap:14px"><label>Email<input id="email" type="email" autocomplete="username" required></label><button class="pri" id="go" type="submit">Send reset link</button></form>
    <button class="link" id="back" type="button">Back to sign in</button>${DISC}`;
  $("#back").onclick = () => loginView();
  $("#f").onsubmit = async (e) => {
    e.preventDefault(); $("#go").disabled = true;
    try { const r = await api("/api/auth/forgot", { email: $("#email").value.trim() }); loginView(null, r.mailEnabled ? "If that email has an account, a reset link is on its way." : "Email isn't set up on this server yet. Ask Amit for a reset link."); }
    catch (x) { loginView(x.message); }
  };
}
async function setPasswordView(token) {
  let t;
  try { t = await api("/api/auth/token/" + encodeURIComponent(token)); } catch (_) { t = { valid: false }; }
  if (!t.valid) { loginView("This link has expired or was already used. Ask Amit for a new one, or use “Forgot password”."); history.replaceState(null, "", "/login"); return; }
  $("#card").innerHTML = `<img class="mono" src="/monogram.png" alt="AXION" width="52" height="52"><h1>${t.purpose === "invite" ? "Welcome" : "New password"}${t.name ? ", " + h(t.name.split(" ")[0]) : ""}</h1><p class="sub">Set a password for <b>${h(t.email)}</b>.</p><div id="m"></div>
    <form id="f" style="display:flex;flex-direction:column;gap:14px">
      <input type="email" value="${h(t.email)}" autocomplete="username" hidden>
      <label>New password <span style="font-weight:400">(at least 10 characters)</span><input id="pw" type="password" autocomplete="new-password" minlength="10" required></label>
      <label>Repeat password<input id="pw2" type="password" autocomplete="new-password" minlength="10" required></label>
      <button class="pri" id="go" type="submit">Save and sign in</button>
    </form>${DISC}`;
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    if ($("#pw").value !== $("#pw2").value) { $("#m").innerHTML = msgHTML("The two passwords don't match.", "err"); return; }
    $("#go").disabled = true;
    try { await api("/api/auth/set-password", { token, password: $("#pw").value }); location.href = "/"; }
    catch (x) { $("#m").innerHTML = msgHTML(x.message, "err"); $("#go").disabled = false; }
  };
  setTimeout(() => $("#pw").focus(), 30);
}

(async () => {
  try { CFG = await api("/api/config"); } catch (_) {}
  const m = location.pathname.match(/^\/(invite|reset)\/([^/]+)/);
  if (m) return setPasswordView(m[2]);
  const e = new URLSearchParams(location.search).get("e");
  loginView(e);
})();
</script>
</body>
</html>
