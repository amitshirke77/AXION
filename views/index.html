<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>AXION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Apple-style workspace — frosted sidebar of companies, a canvas of rounded grouped cards, inset lists for actions, and a sheet that slides in for each item */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --sunk:#f2f2f7; --fill:rgba(118,118,128,.12); --ink:#1d1d1f; --muted:#6e6e73; --faint:#8e8e93; --line:rgba(60,60,67,.14);
  --glass:rgba(250,250,252,.78); --primary:#0071e3; --primary-h:#0077ed; --on-primary:#ffffff; --focus:#0071e3; --tint:rgba(0,113,227,.10);
  --poc:#5e5ce6; --exp:#30b0c7; --ukb:#ff9f0a;
  --red:#ff3b30; --red-bg:rgba(255,59,48,.12); --amber:#c46a00; --amber-bg:rgba(255,149,0,.14); --green:#248a3d; --green-bg:rgba(52,199,89,.14); --blue:#0066cc; --blue-bg:rgba(0,113,227,.10);
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  --shadow-lg:0 24px 60px rgba(0,0,0,.18);
  --f-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:18px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --sunk:#2c2c2e; --fill:rgba(118,118,128,.24); --ink:#f5f5f7; --muted:#a1a1a6; --faint:#8e8e93; --line:rgba(84,84,88,.6);
  --glass:rgba(28,28,30,.72); --primary:#0a84ff; --primary-h:#409cff; --on-primary:#ffffff; --focus:#0a84ff; --tint:rgba(10,132,255,.18);
  --poc:#7d7aff; --exp:#64d2ff; --ukb:#ffb340;
  --red:#ff453a; --red-bg:rgba(255,69,58,.18); --amber:#ffb340; --amber-bg:rgba(255,159,10,.18); --green:#30d158; --green-bg:rgba(48,209,88,.16); --blue:#64a8ff; --blue-bg:rgba(10,132,255,.18);
  --shadow:0 0 0 1px rgba(255,255,255,.04); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --sunk:#2c2c2e; --fill:rgba(118,118,128,.24); --ink:#f5f5f7; --muted:#a1a1a6; --faint:#8e8e93; --line:rgba(84,84,88,.6);
  --glass:rgba(28,28,30,.72); --primary:#0a84ff; --primary-h:#409cff; --on-primary:#ffffff; --focus:#0a84ff; --tint:rgba(10,132,255,.18);
  --poc:#7d7aff; --exp:#64d2ff; --ukb:#ffb340;
  --red:#ff453a; --red-bg:rgba(255,69,58,.18); --amber:#ffb340; --amber-bg:rgba(255,159,10,.18); --green:#30d158; --green-bg:rgba(48,209,88,.16); --blue:#64a8ff; --blue-bg:rgba(10,132,255,.18);
  --shadow:0 0 0 1px rgba(255,255,255,.04); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.47;letter-spacing:-.01em;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid color-mix(in srgb, var(--focus) 55%, transparent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.022em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
/* sidebar */
.nav{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-right:1px solid var(--line);padding:22px 12px 28px max(12px, env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:2px 10px 18px;display:flex;align-items:center;gap:11px}
.brand>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.bmark{display:block;flex:none;width:42px;height:42px;border-radius:10px}
.bmark.sm{width:34px;height:34px;border-radius:8px}
.bmark.xs{width:26px;height:26px;border-radius:6px}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.025em}
.brand span{color:var(--muted);font-size:12.5px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14px;transition:background .15s}
.nav a:hover{background:var(--fill)}
.nav a.on{background:var(--primary);color:#fff}
.nav a.on .badge{background:rgba(255,255,255,.22);color:#fff}
.nav a.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.nav .grp{margin-top:20px}
.nav .lbl{font-size:12px;font-weight:600;color:var(--faint);padding:0 10px 6px}
.nav .co{font-weight:600}
.nav .cl{padding-left:28px}
.nav .tm{padding-left:44px;color:var(--muted);font-size:13.5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.nav .n{margin-left:auto;display:flex;gap:4px}
.badge{font-size:12px;font-weight:500;min-width:22px;text-align:center;padding:1px 7px;border-radius:999px;background:var(--fill);color:var(--muted);font-variant-numeric:tabular-nums}
.badge.red{background:var(--red);color:#fff}
/* canvas */
.main{min-width:0;padding-block:34px 72px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mobnav{display:none}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;justify-content:space-between;padding:0 4px}
.crumb{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:4px}
.crumb a{color:var(--primary)!important;text-decoration:none!important}
.head h1{font-size:40px;line-height:1.08;letter-spacing:-.028em}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--fill);border-radius:999px;padding:8px 17px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;color:var(--primary);transition:background .15s, transform .1s}
.btn:hover{background:color-mix(in srgb, var(--fill) 100%, var(--ink) 6%)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:var(--primary-h)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.banner{padding:14px 18px;border-radius:14px;background:var(--amber-bg);color:var(--amber);font-weight:500}
/* stat cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:16px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
button.kpi{border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;transition:transform .15s, box-shadow .15s}
button.kpi:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.09)}
button.kpi.sel{box-shadow:0 0 0 2px var(--primary), var(--shadow)}
button.kpi .k::after{content:" ›";opacity:0;transition:opacity .15s}
button.kpi:hover .k::after,button.kpi:focus-visible .k::after{opacity:1}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k{font-size:13px;color:var(--muted);font-weight:500}
.kpi.red .v{color:var(--red)} .kpi.amber .v{color:var(--amber)} .kpi.green .v{color:var(--green)}
.num{border:0;background:none;font:inherit;color:var(--primary);cursor:pointer;padding:2px 8px;margin:-2px -8px;border-radius:999px;font-weight:600}
.num.late{color:var(--red)}
.num:hover{background:var(--tint)}
/* cards */
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px 12px;flex-wrap:wrap}
.panel>header h2{font-size:21px;letter-spacing:-.022em}
.panel .sub{color:var(--muted);font-size:13px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:4px}
.tblwrap{overflow-x:auto;padding:0 8px 8px}
table.sum{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:720px}
table.sum th{font-size:12px;color:var(--faint);font-weight:500;text-align:right;padding:8px 14px}
table.sum th:first-child,table.sum td:first-child{text-align:left}
table.sum td{padding:10px 14px;border-top:1px solid var(--line);text-align:right;font-size:14px}
table.sum td:first-child{font-size:15px}
table.sum tr[data-act]{cursor:pointer}
table.sum tr[data-act]:hover td{background:var(--sunk)}
table.sum tr.co td{font-weight:600;border-top-color:transparent;padding-top:16px}
table.sum tr.co td:first-child{font-family:var(--f-display);font-size:17px}
table.sum tr.cl td:first-child{padding-left:34px}
table.sum tr.tm td:first-child{padding-left:54px;color:var(--muted)}
.rag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:10px;vertical-align:2px}
.rag.r{background:var(--red)} .rag.a{background:#ff9500} .rag.g{background:#34c759}
.zero{color:var(--faint);opacity:.6}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 22px 14px}
.filters input[type=search]{flex:1 1 220px;min-width:0}
.inp,select.inp,textarea.inp{border:0;background:var(--fill);border-radius:var(--r-sm);padding:8px 12px;min-width:0;max-width:100%;outline:none;transition:box-shadow .15s}
.inp:focus{box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 35%, transparent)}
select.inp{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
textarea.inp{width:100%;resize:vertical}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.chk input{accent-color:var(--primary);width:17px;height:17px}
/* inset action list */
.rows{display:flex;flex-direction:column;margin:0 10px 10px;border-radius:14px;overflow:hidden}
.rowh,.row{display:grid;grid-template-columns:100px minmax(0,1fr) 72px 128px 160px 92px 92px;gap:14px;align-items:start;padding:13px 14px}
.rowh{font-size:12px;color:var(--faint);font-weight:500;padding-block:6px}
.row{cursor:pointer;position:relative;border-top:1px solid var(--line);transition:background .12s;border-radius:12px}
.rowh + .row{border-top-color:transparent}
.row:hover{background:var(--sunk)}
.row:hover + .row{border-top-color:transparent}
.row .ref{font-family:var(--f-mono);font-size:12px;color:var(--faint);padding-top:3px}
.row .t{font-weight:600;line-height:1.32;font-size:15px}
.row .nba{font-size:13.5px;color:var(--muted);margin-top:3px}
.row .nba b{font-weight:600;color:var(--primary)}
.row .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.row .ppl{font-size:13px;color:var(--muted)}
.row .ppl b{color:var(--ink);font-weight:600;font-size:11px;background:var(--fill);border-radius:4px;padding:0 4px;margin-right:2px}
.row .dt{font-size:13.5px;font-variant-numeric:tabular-nums;font-weight:500}
.row .dt small{display:block;color:var(--faint);font-size:11.5px;font-weight:400}
.row.closed{opacity:.62}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--fill);color:var(--muted);white-space:nowrap}
.chip.red{background:var(--red-bg);color:var(--red)} .chip.amber{background:var(--amber-bg);color:var(--amber)} .chip.green{background:var(--green-bg);color:var(--green)} .chip.blue{background:var(--blue-bg);color:var(--blue)}
.pri{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;display:inline-block;font-variant-numeric:tabular-nums}
.pri.P1{background:var(--red);color:#fff} .pri.P2{background:var(--red-bg);color:var(--red)} .pri.P3{background:var(--amber-bg);color:var(--amber)} .pri.P4{background:var(--fill);color:var(--muted)}
.st{font-size:13.5px;display:inline-flex;align-items:center;gap:7px;font-weight:500}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.st.ip::before{background:var(--primary)} .st.bl::before{background:var(--red)} .st.aw::before{background:#ff9500} .st.dn::before{background:#34c759}
.late{color:var(--red)}
.cobar{position:absolute;left:4px;top:16px;width:4px;height:18px;border-radius:2px}
.row.sub{padding-left:40px}
.row.sub::before{content:"↳";position:absolute;left:20px;top:13px;color:var(--faint);font-size:14px}
body.compact .row.sub::before{top:6px}
.subs{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--sunk)}
.subrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;font-size:14px;border-top:1px solid var(--line)}
.subrow:first-child{border-top:0}
.subrow:hover{background:var(--fill)}
.subrow .mono{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.subrow .stt{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subrow .who,.subrow .dt{color:var(--muted);font-size:13px;white-space:nowrap}
.subrow .dt.late{color:var(--red)}
.subrow.done{opacity:.6}
.subrow.done .stt{text-decoration:line-through}
.subadd{display:grid;grid-template-columns:minmax(0,1fr) 170px 150px auto;gap:8px}
.lnk{color:var(--primary);cursor:pointer;text-decoration:none}
.lnk:hover{text-decoration:underline}
@media (max-width:640px){ .subadd{grid-template-columns:1fr 1fr} .subadd #s-title{grid-column:1/-1} .subrow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px} .subrow .mono,.subrow .who{display:none} }
.att{display:flex;flex-direction:column;margin:0 10px 10px}
.att .row{grid-template-columns:100px minmax(0,1fr) 72px 220px}
.att .row:first-child{border-top-color:transparent}
.closedrow .t{text-decoration:none}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40}
.drawer{position:fixed;top:10px;right:10px;bottom:10px;width:min(780px,calc(100% - 20px));background:var(--bg);z-index:41;display:flex;flex-direction:column;border-radius:22px;box-shadow:var(--shadow-lg);overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;align-items:flex-start;gap:12px;padding:22px 26px 16px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.dhead .x{margin-left:auto}
.dhead h2{font-size:24px;letter-spacing:-.025em;line-height:1.2}
.dbody{overflow:auto;padding:18px 18px 30px;display:flex;flex-direction:column;gap:14px}
.sect{display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.sect>h3{font-size:13px;font-family:var(--f-body);color:var(--muted);font-weight:600;letter-spacing:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12.5px;color:var(--muted);font-weight:500}
.fld>span em{font-style:normal;color:var(--faint);font-weight:400}
.fld .inp{width:100%}
.hint{font-size:12.5px;color:var(--faint)}
.mlist{display:flex;flex-direction:column;margin:0 10px 10px}
.mrow{display:grid;grid-template-columns:80px minmax(0,1fr) 170px 90px;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;position:relative;border-radius:12px}
.mrow:first-child{border-top-color:transparent}
.mrow:hover{background:var(--sunk)}
.mrow .md b{display:block;font-size:14px}.mrow .md small{color:var(--faint);font-size:12px}
.mrow .t{font-weight:600}
.mrow .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.mrow .mc{color:var(--muted);font-size:13px}
.mrow .ms{text-align:right}
.subadd.mlink{grid-template-columns:minmax(0,1fr) auto}
.subrow .btn.x{padding:2px 9px}
@media (max-width:640px){ .mrow{grid-template-columns:70px minmax(0,1fr)} .mrow .mc,.mrow .ms{display:none} .subadd.mlink{grid-template-columns:1fr} }
footer.disc{font-size:11.5px;line-height:1.5;color:var(--faint);border-top:1px solid var(--line);padding:14px 4px 0;margin-top:8px}
footer.disc b{color:var(--muted);font-weight:600}
footer.disc a{color:var(--primary);cursor:pointer}
.p-disc{text-align:center;font-size:11px;color:var(--s-faint,#6e6e73);padding:0 0 10px}
/* ---------- help page styles ---------- */
.hlay{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.htoc{position:sticky;top:20px;display:flex;flex-direction:column;padding:12px;gap:1px;max-height:calc(100vh - 40px);overflow:auto}
.htoc .inp{margin-bottom:8px}
.htoc a{padding:7px 10px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--ink)}
.htoc a:hover{background:var(--fill)}
.hmain{display:flex;flex-direction:column;gap:14px;min-width:0}
.hsec{scroll-margin-top:16px;transition:box-shadow .3s}
.hsec.flash{box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 45%,transparent)}
.hbody{padding:0 22px 18px;font-size:14.5px;line-height:1.6;color:var(--ink)}
.hbody p{margin:0 0 10px}
.hbody h4{margin:14px 0 6px;font-size:14px;font-weight:600}
.hbody ul,.hbody ol{margin:0 0 10px;padding-left:22px}
.hbody li{margin:3px 0}
.hbody a{color:var(--primary);cursor:pointer}
.hbody code{font-family:var(--f-mono);font-size:12.5px;background:var(--fill);padding:1px 5px;border-radius:5px}
.htbl{border-collapse:collapse;width:100%;margin:4px 0 12px}
.htbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.htbl td:first-child{width:30%;white-space:nowrap}
.hfaq dt{font-weight:600;margin-top:10px}
.hfaq dd{margin:2px 0 0;color:var(--muted)}
@media (max-width:860px){ .hlay{grid-template-columns:1fr} .htoc{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;gap:4px} .htoc .inp{flex-basis:100%} .htoc a{background:var(--fill);border-radius:999px;padding:5px 12px;font-size:13px} .htbl td:first-child{white-space:normal;width:38%} .hbody{padding:0 16px 16px} }
/* ---------- compact density (Overall view + client/company views) ---------- */
.dens{align-self:center}
.dens button{padding:5px 12px}
body.compact .wrap{gap:12px}
body.compact .main{padding-top:20px}
body.compact .head h1{font-size:28px}
body.compact .crumb{margin-bottom:1px}
body.compact .kpis{grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
body.compact .kpi{padding:8px 12px 7px;border-radius:12px;flex-direction:row;align-items:baseline;gap:8px}
body.compact .kpi .v{font-size:22px}
body.compact .kpi .k{font-size:12px;line-height:1.2}
body.compact .panel>header{padding:10px 16px 6px}
body.compact .panel>header h2{font-size:16px}
body.compact .panel .sub{font-size:12px}
body.compact .filters{padding:2px 16px 8px;gap:6px}
body.compact .filters .inp{padding-top:5px;padding-bottom:5px;font-size:13px}
body.compact table.sum td{padding:4px 12px;font-size:13px}
body.compact table.sum td:first-child{font-size:13.5px}

/* Report browser errors to the server (System status page). At most 5 per page load, no repeats. */
(function(){
  var seen = {}, n = 0;
  function report(msg, stack){
    msg = String(msg || "Unknown error").slice(0, 500);
    if (seen[msg] || n >= 5 || /ResizeObserver loop|Script error\.?$/.test(msg)) return;
    seen[msg] = 1; n++;
    try { fetch("/api/client-error", { method: "POST", headers: { "content-type": "application/json", "x-tracker": "1" }, credentials: "same-origin", keepalive: true,
      body: JSON.stringify({ message: msg, stack: String(stack || "").slice(0, 3000), url: location.pathname + location.hash }) }).catch(function(){}); } catch (_) {}
  }
  window.addEventListener("error", function(e){ report(e.message, e.error && e.error.stack); });
  window.addEventListener("unhandledrejection", function(e){ var r = e.reason || {}; if (r.code === "revoked") return; report("Unhandled: " + (r.message || r), r.stack); });
  window.reportClientError = report;
})();

const TYPE_FREQ = {"Quarterly meeting":"quarterly","Monthly meeting":"monthly","Weekly meeting":"weekly","Ongoing (recurring)":"weekly"};
const ROLES = ["Leadership","Account manager","Team leader","Analyst","Client contact","Other"];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const z = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((new Date(a+"T00:00:00") - new Date(b+"T00:00:00"))/864e5);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = s => { if(!s) return "—"; const [y,m,d] = s.slice(0,10).split("-"); return `${+d} ${MON[+m-1]}${y!==String(new Date().getFullYear())?" "+y.slice(2):""}`; };
const fmtTime = iso => { if(!iso) return ""; const d = new Date(iso); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}, ${z(d.getHours())}:${z(d.getMinutes())}`; };
const nowISO = () => new Date().toISOString();
function addFreq(s, f){
  const d = new Date(s+"T00:00:00");
  const months = {monthly:1, quarterly:3, halfyearly:6, yearly:12}[f];
  if (months) d.setMonth(d.getMonth()+months);
  else d.setDate(d.getDate() + ({daily:1, weekly:7, fortnightly:14}[f] || 0));
  return ymd(d);
}
function weekBounds(which){
  const t = today(); const dow = (new Date(t+"T00:00:00").getDay()+6)%7; const mon = addDays(t,-dow);
  return which==="this" ? {start:mon, end:t} : {start:addDays(mon,-7), end:addDays(mon,-1)};
}
const closedDay = a => a.closedAt ? ymd(new Date(a.closedAt)) : "";
const closedBetween = (list, b) => list.filter(a=>CLOSED.includes(a.status) && a.closedAt && closedDay(a)>=b.start && closedDay(a)<=b.end).sort((x,y)=>y.closedAt.localeCompare(x.closedAt));
function toast(msg){ const t = document.createElement("div"); t.className="toast"; t.textContent = msg; $("#toastHost").replaceChildren(t); setTimeout(()=>{ if(t.isConnected) t.remove(); }, 2600); }
const freqLabel = f => (FREQS.find(x=>x[0]===f)||["","—"])[1];
const stClass = s => ({"In progress":"ip","Blocked":"bl","Awaiting input":"aw","Done":"dn"}[s]||"");

/* ---------- structure lookups ---------- */
const allCompanies = () => (S.structure?.companies)||[];
function scopeAllows(coId, clId, tmId){
  if (S.role==="admin") return true;
  if (S.role==="client") return !!clId && clId===S.me.clientId;
  return (S.me.scopes||[]).some(s=> s==="*" || s===coId || (clId && (s===`${coId}:${clId}` || (tmId ? s===`${coId}:${clId}:${tmId}` : s.startsWith(`${coId}:${clId}:`)))));
}
function companies(){
  if (S.role==="admin") return allCompanies();
  const out = [];
  for (const c of allCompanies()){
    const clients = (c.clients||[]).filter(k => scopeAllows(c.id,k.id) || S.actions.some(a=>a.companyId===c.id && a.clientId===k.id)).map(k => ({...k, teams:(k.teams||[]).filter(t => S.role!=="client" && (scopeAllows(c.id,k.id,t.id) || S.actions.some(a=>a.clientId===k.id && a.teamId===t.id)))}));
    if (clients.length || scopeAllows(c.id) || S.actions.some(a=>a.companyId===c.id)) out.push({...c, clients});
  }
  return out;
}
const involved = a => [a.accountable,...(a.responsible||[]),...(a.consulted||[])].includes(S.meId);
const masterOf = a => a && a.parentId ? S.actions.find(x=>x.id===a.parentId) || null : null;
const kidsOf = a => a && !a.parentId ? S.actions.filter(x=>x.parentId===a.id) : [];
const isTaskOwner = a => S.role!=="client" && !!a && a.accountable===S.meId;
// Sub-tasks go to internal people of the main task's company, or group-wide people
const sameOrgP = (p, coId) => !!p && p.active!==false && p.side!=="client" && (!p.companyId || p.companyId===coId);
const isClientOwn = a => S.role==="client" && !!a && !!a.createdByClient && a.createdBy===S.meId;
const canEditA = a => isClientOwn(a) || S.role==="admin" || (S.role==="editor" && scopeAllows(a.companyId, a.clientId, a.teamId)) || (!!a.parentId && isTaskOwner(masterOf(a)));
const canAddSub = m => !!m && !m.parentId && !CLOSED.includes(m.status) && S.role!=="client" && (S.role==="admin" || (S.role==="editor" && scopeAllows(m.companyId, m.clientId, m.teamId)) || isTaskOwner(m));
function subRef(m){ let max = 0; for (const a of S.actions) if (a.ref && a.ref.startsWith(m.ref+".")){ const n = parseInt(a.ref.slice(m.ref.length+1),10); if (n>max) max = n; } return `${m.ref}.${max+1}`; }
/* Put sub-tasks directly under their main task when both are in the list */
function nestKids(list){
  const ids = new Set(list.map(a=>a.id)), out = [];
  for (const a of list){
    if (a.parentId && ids.has(a.parentId)) continue;
    out.push(a);
    if (!a.parentId) for (const k of list) if (k.parentId===a.id) out.push(k);
  }
  return out;
}
const canUpdA = a => canEditA(a) || (S.role==="contributor" && involved(a));
const types = () => (S.structure?.types)||[];
const co = id => companies().find(c=>c.id===id);
const cl = (coId, clId) => (co(coId)?.clients||[]).find(c=>c.id===clId);
const tm = (coId, clId, tmId) => (cl(coId,clId)?.teams||[]).find(t=>t.id===tmId);
function containerLabel(a){
  const c = co(a.companyId); if(!c) return "Unassigned";
  const k = cl(a.companyId, a.clientId); const t = tm(a.companyId, a.clientId, a.teamId);
  return [c.name, k ? k.name : "Company-level", t && t.name].filter(Boolean).join(" · ");
}
function refPrefix(coId, clId, tmId){
  const c = co(coId), k = cl(coId,clId), t = tm(coId,clId,tmId);
  if (k && t) return `${k.code}-${t.code}`;
  if (k) return k.code;
  return c ? c.code : "ACT";
}
function nextRef(prefix){
  let max = 0;
  for (const a of S.actions){ if (a.ref && a.ref.startsWith(prefix+"-")) { const n = parseInt(a.ref.slice(prefix.length+1),10); if (n>max) max=n; } }
  return `${prefix}-${String(max+1).padStart(3,"0")}`;
}
const person = id => S.people.find(p=>p.id===id);
const pname = id => person(id)?.name || "—";
const coColor = id => CO_COLORS[id] || "var(--faint)";

/* ---------- derived ---------- */
function derive(a){
  const t = today();
  const open = !CLOSED.includes(a.status);
  const overdue = open && !!a.due && a.due < t;
  const nbdSlip = open && !!a.nbd && a.nbd < t;
  const cadence = +a.updateEvery || 0;
  const last = (a.lastUpdateAt || a.createdAt || "").slice(0,10);
  const since = last ? diffDays(t, last) : null;
  const updDue = S.role!=="client" && open && cadence > 0 && since !== null && since >= cadence;
  const recurring = !!(a.recur && a.recur.freq && a.recur.freq !== "none");
  const remDue = S.role!=="client" && open && recurring && !!a.recur.next && a.recur.next <= addDays(t, +a.recur.lead || 0);
  const due7 = open && !!a.due && a.due >= t && a.due <= addDays(t,7);
  return {open, overdue, nbdSlip, updDue, remDue, recurring, due7, since};
}
function inScope(a, sc){
  if (!sc || sc.kind === "all" || !sc.co) return true;
  if (a.companyId !== sc.co) return false;
  if (!sc.cl) return true;
  if (sc.cl === "_co") return !a.clientId;
  if (a.clientId !== sc.cl) return false;
  if (!sc.tm) return true;
  return a.teamId === sc.tm;
}
function stats(list){
  const t = today(), wkAgo = addDays(t,-7);
  const lw = weekBounds("last");
  const s = {open:0, overdue:0, p12:0, due7:0, upd:0, rem:0, blocked:0, closed7:0, closedLast:0, total:list.length};
  for (const a of list){ if (a.parentId) continue; // counts are main tasks only; sub-task progress shows on the main task
    const d = derive(a);
    if (d.open){ s.open++; if(a.status==="Blocked") s.blocked++; if(d.overdue) s.overdue++; if(a.priority==="P1"||a.priority==="P2") s.p12++; if(d.due7) s.due7++; if(d.updDue) s.upd++; if(d.remDue) s.rem++; }
    else if (a.status==="Done" && a.closedAt){ const cd = closedDay(a); if (cd >= wkAgo) s.closed7++; if (cd>=lw.start && cd<=lw.end) s.closedLast++; }
  }
  return s;
}
function rag(list){
  const s = stats(list);
  const p1Late = list.some(a => { if (a.parentId) return false; const d = derive(a); return d.overdue && a.priority==="P1"; });
  if (p1Late || (s.open && s.overdue/s.open > .2)) return "r";
  if (s.overdue || s.upd) return "a";
  return "g";
}
const PRANK = {P1:1,P2:2,P3:3,P4:4};
function sortActions(list){
  return list.slice().sort((a,b)=>{
    const da = derive(a), db_ = derive(b);
    if (da.open !== db_.open) return da.open ? -1 : 1;
    if (!da.open) return (b.closedAt||"").localeCompare(a.closedAt||"");
    if (da.overdue !== db_.overdue) return da.overdue ? -1 : 1;
    const p = (PRANK[a.priority]||9) - (PRANK[b.priority]||9); if (p) return p;
    return (a.nbd||a.due||"9999").localeCompare(b.nbd||b.due||"9999");
  });
}

/* ---------- navigation ---------- */
function scopeOfView(){ const v = S.view; return v.kind==="container" ? v : {kind:"all"}; }
function go(view){ S.view = view; S.filters = {...S.filters, q:"", person:"", flag:""}; render(); window.scrollTo(0,0); }
function viewKey(v){ return v.kind==="container" ? `c:${v.co}:${v.cl||""}:${v.tm||""}` : v.kind; }

function renderNav(){

  <a data-act="nav" data-v="overview" class="${vk==="overview"?"on":""}">${internal?"Overall view":"Overview"} ${badge(S.actions)}</a>

  <a data-act="nav" data-v="weekly" class="${vk==="weekly"?"on":""}">Weekly updates</a>
  <a data-act="nav" data-v="setup" class="${vk==="setup"?"on":""}">People &amp; setup</a>`:""}
  <a data-act="nav" data-v="help" class="${vk==="help"?"on":""}">Help</a>
  ${S.role==="admin"?`<a data-act="nav" data-v="status" class="${vk==="status"?"on":""}">System status ${S.statusAlert?`<span class="n"><span class="badge red" title="Errors in the last 24 hours">${S.statusAlert}</span></span>`:""}</a>`:""}`;
  html += `<div class="grp"><div class="lbl">Companies</div>`;
  for (const c of companies()){
    const ca = S.actions.filter(a=>a.companyId===c.id);
    html += `<a class="co ${vk===`c:${c.id}::`?"on":""}" data-act="nav" data-v="c" data-co="${h(c.id)}"><span class="dot" style="background:${coColor(c.id)}"></span>${h(c.name)} ${badge(ca)}</a>`;
    for (const k of c.clients||[]){
      const ka = ca.filter(a=>a.clientId===k.id);
      html += `<a class="cl ${vk===`c:${c.id}:${k.id}:`?"on":""}" data-act="nav" data-v="c" data-co="${h(c.id)}" data-cl="${h(k.id)}">${h(k.name)} ${badge(ka)}</a>`;
      for (const t of k.teams||[]){
        const ta = ka.filter(a=>a.teamId===t.id);
        html += `<a class="tm ${vk===`c:${c.id}:${k.id}:${t.id}`?"on":""}" data-act="nav" data-v="c" data-co="${h(c.id)}" data-cl="${h(k.id)}" data-tm="${h(t.id)}">${h(t.name)} team ${badge(ta)}</a>`;
      }
    }
    if (ca.some(a=>!a.clientId)) html += `<a class="cl ${vk===`c:${c.id}:_co:`?"on":""}" data-act="nav" data-v="c" data-co="${h(c.id)}" data-cl="_co">Company-level ${badge(ca.filter(a=>!a.clientId))}</a>`;
  }
  html += `</div>`;
  if (S.me) html += `<div class="me"><b>${h(S.me.name)}</b><span class="r">${h(ROLE_LABEL[S.role]||S.role)}</span><div class="links"><a data-act="account">Account</a><a data-act="signout">Sign out</a></div></div>`;
  $("#nav").innerHTML = html;
}
function mobNav(){
  const vk = viewKey(S.view);
  let o = S.role!=="client" ? `<option value="overview">Overall view</option><option value="meetings">Meetings &amp; minutes</option><option value="weekly">Weekly updates</option><option value="setup">People &amp; setup</option>${S.role==="admin"?`<option value="status">System status</option>`:""}<option value="help">Help</option>` : `<option value="overview">Overview</option><option value="help">Help</option>`;
  for (const c of companies()){
    o += `<optgroup label="${h(c.name)}"><option value="c:${h(c.id)}::">${h(c.name)} — all</option>`;
    for (const k of c.clients||[]){ o += `<option value="c:${h(c.id)}:${h(k.id)}:">${h(k.name)}</option>`; for (const t of k.teams||[]) o += `<option value="c:${h(c.id)}:${h(k.id)}:${h(t.id)}">&nbsp;&nbsp;${h(k.name)} · ${h(t.name)}</option>`; }
    o += `</optgroup>`;
  }
  return `<div class="mobnav"><img class="bmark sm" src="/monogram.png" alt="AXION" width="34" height="34"><select class="inp" id="mobsel" aria-label="Go to">${o.replace(`value="${h(vk)}"`,`value="${h(vk)}" selected`)}</select><button class="btn sm" data-act="account">Account</button></div>`;
}

/* ---------- main render ---------- */
function render(){
  renderNav();
  const m = $("#main");
  if (S.err){ m.innerHTML = mobNav() + `<div class="banner">${h(S.err)}</div>` + DISCLAIMER_HTML; return; }
  if (!S.structureLoaded || !S.actionsLoaded){ return; }
  const ro = S.role==="client" ? `<div class="banner" style="background:var(--blue-bg);color:var(--blue)">Action items shared with ${h(S.clientName||"your team")}, plus your own. Press <b>New action</b> to track your own work: it stays private to you until you assign someone from the team.</div>` : "";
  if (S.role==="client" && (S.view.kind==="weekly" || S.view.kind==="setup" || S.view.kind==="meetings")) S.view = {kind:"overview"};
  if (S.view.kind==="status" && S.role!=="admin") S.view = {kind:"overview"};
  const k = S.view.kind;
  m.innerHTML = mobNav() + ro + (k==="overview" ? viewOverview() : k==="container" ? viewContainer() : k==="weekly" ? viewWeekly() : k==="status" ? viewStatus() : k==="help" ? viewHelp() : k==="meetings" ? viewMeetings() : viewSetup()) + DISCLAIMER_HTML;
  if (k==="weekly") hydrateWeekly();
  if (k==="status") loadStatus(false);
}

function densityToggle(){ return `<div class="seg dens" role="group" aria-label="Density"><button class="${S.compact?"":"on"}" data-act="density" data-c="0" aria-pressed="${!S.compact}">Comfortable</button><button class="${S.compact?"on":""}" data-act="density" data-c="1" aria-pressed="${!!S.compact}">Compact</button></div>`; }

function scopeAttrs(sc){ return sc && sc.co ? `data-co="${h(sc.co)}" data-cl="${h(sc.cl||"")}" data-tm="${h(sc.tm||"")}"` : `data-co="" data-cl="" data-tm=""`; }
function kpiStrip(s, scoped){
  const sa = scopeAttrs(scoped ? S.view : null); const cur = scoped ? S.filters.flag : null;
  const cell = (v,k,cls,flag) => `<button type="button" class="kpi ${v?cls:""} ${cur===flag&&scoped?"sel":""}" data-act="drill" data-flag="${flag}" ${sa} aria-label="Show ${h(k.toLowerCase())}: ${v}"><span class="v">${v}</span><span class="k">${k}</span></button>`;
  return `<div class="kpis">${cell(s.open,"Open actions","","open")}${S.role==="client"?"":cell(s.overdue,"Past due date","red","overdue")}${cell(s.blocked,"Blocked","red","blocked")}${cell(s.p12,"Open P1 / P2","amber","p12")}${S.role==="client"?"":cell(s.due7,"Due in 7 days","","due7")}${S.role==="client"?"":cell(s.upd,"Updates pending","amber","upd")+cell(s.rem,"Repeat reminders due","","rem")}${cell(s.closedLast,"Closed last week","green","closedLast")}</div>`;
}

function viewOverview(){
  const s = stats(S.actions);
  let rows = "";
  const line = (cls, label, list, nav, color) => { const x = stats(list); const sa = nav.replace(/data-act="nav" data-v="c" /,"");
    const n = (v, flag, late) => v ? `<button type="button" class="num ${late?"late":""}" data-act="drill" data-flag="${flag}" ${sa}>${v}</button>` : `<span class="zero">0</span>`;
    return `<tr class="${cls}" ${nav}><td><span class="rag ${rag(list)}"></span>${color?`<span class="dot" style="display:inline-block;background:${color};margin-right:8px"></span>`:""}${label}</td><td>${n(x.open,"open")}</td><td class="ic">${n(x.overdue,"overdue",true)}</td><td>${n(x.p12,"p12")}</td><td class="ic">${n(x.due7,"due7")}</td><td class="ic">${n(x.upd,"upd")}</td><td class="ic">${n(x.rem,"rem")}</td><td>${n(x.closedLast,"closedLast")}</td></tr>`; };
  for (const c of companies()){
    const ca = S.actions.filter(a=>a.companyId===c.id);
    rows += line("co", h(c.name), ca, `data-act="nav" data-v="c" data-co="${h(c.id)}"`, coColor(c.id));
    for (const k of c.clients||[]){
      const ka = ca.filter(a=>a.clientId===k.id);
      rows += line("cl", h(k.name) + (k.clientSharing?` <span class="chip blue">Client updates on</span>`:""), ka, `data-act="nav" data-v="c" data-co="${h(c.id)}" data-cl="${h(k.id)}"`);
      for (const t of k.teams||[]) rows += line("tm", h(t.name)+" team", ka.filter(a=>a.teamId===t.id), `data-act="nav" data-v="c" data-co="${h(c.id)}" data-cl="${h(k.id)}" data-tm="${h(t.id)}"`);
    }
    if (!(c.clients||[]).length || ca.some(a=>!a.clientId)) rows += line("cl", "Company-level", ca.filter(a=>!a.clientId), `data-act="nav" data-v="c" data-co="${h(c.id)}" data-cl="_co"`);
  }
  const attention = sortActions(S.actions.filter(a=>{ const d = derive(a); return (d.open && a.status==="Blocked") || d.overdue || d.updDue || d.remDue || d.nbdSlip || (d.open && a.priority==="P1"); })).slice(0,25);
  return `<div class="head"><div><div class="crumb">${S.role==="admin"?"All three companies":h(S.me?.name||"")} · ${fmt(today())}</div><h1>${S.role==="client"?h(S.clientName||"Overview"):"Overall view"}</h1></div>
    <div class="actions">${densityToggle()}<button class="btn" data-act="present">Present</button>${S.role!=="client"?`<button class="btn" data-act="nav" data-v="weekly">Prepare weekly update</button>`:""}${S.canCreate||S.role==="client"?`<button class="btn pri" data-act="new">New action</button>`:""}</div></div>
  ${kpiStrip(s,false)}
  <section class="panel"><header><h2>By company, client and team</h2><span class="sub">Health: red = a P1 is late or over 20% of open items are late · amber = anything late or an update pending</span></header>
    <div class="tblwrap"><table class="sum"><thead><tr><th>Container</th><th>Open</th><th class="ic">Late</th><th>P1/P2</th><th class="ic">Due 7d</th><th class="ic">Updates pending</th><th class="ic">Reminders</th><th>Closed last wk</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="panel"><header><h2>Needs attention</h2><span class="sub">Late, P1, slipped next-best-date, overdue updates and repeat reminders</span></header>
    ${attention.length ? `<div class="att">${attention.map(a=>rowHTML(a,true)).join("")}</div>` : `<div class="empty"><b>${S.actions.length?"Nothing needs attention right now":"No action items yet"}</b>${S.actions.length?"Late items, P1s, pending updates and due reminders will gather here.":"Pick a client on the left, or press New action to log the first item."}</div>`}</section>
  ${closedPanel(S.actions, true)}`;
}

/* ---------- latest activity + "new since you looked" ---------- */
const SEEN_KEY = "axion.seen";
function seenMap(){ if (S._seen) return S._seen; let m = null; try { m = JSON.parse(localStorage.getItem(SEEN_KEY)||"null"); } catch(_){}
  if (!m || typeof m!=="object") { m = {_base: Date.now()}; try { localStorage.setItem(SEEN_KEY, JSON.stringify(m)); } catch(_){} }
  return (S._seen = m); }
function markSeen(id){ const m = seenMap(); m[id] = Date.now(); const keys = Object.keys(m).filter(k=>k!=="_base"); if (keys.length > 800) keys.sort((a,b)=>m[a]-m[b]).slice(0, keys.length-800).forEach(k=>delete m[k]); try { localStorage.setItem(SEEN_KEY, JSON.stringify(m)); } catch(_){} }
function latestOf(a){
  if (a.lastActivity && a.lastActivity.at) return a.lastActivity;
  if (a.lastUpdateAt && a.lastUpdateText) return {at:a.lastUpdateAt, by:a.lastUpdateBy||null, kind:"update", text:a.lastUpdateText, blocker:false};
  return null;
}
function isNewFor(a){ const x = latestOf(a); if (!x || !x.at || (x.by && x.by===S.meId)) return false; const m = seenMap(); const t = Date.parse(x.at); return t > Math.max(m[a.id]||0, m._base||0) && Date.now()-t < 14*864e5; }
function agoTxt(ms){ const s = Math.max(0, Math.round((Date.now()-ms)/1000)); if (s<60) return "just now"; if (s<3600) return Math.round(s/60)+" min ago"; if (s<86400) return Math.round(s/3600)+" h ago"; const d = Math.round(s/86400); return d===1?"yesterday":d+" days ago"; }
function activityHTML(a){
  const x = latestOf(a); if (!x || !x.text) return "";
  const nw = isNewFor(a), kind = x.blocker ? "Blocker" : x.kind==="update" ? "Update" : x.kind==="system" ? "Change" : "Comment";
  return `<div class="actl ${x.blocker?"blk":x.kind==="update"?"upd":""} ${nw?"new":""}" title="${h(x.text)}">${nw?`<span class="newpill">New</span>`:""}<span class="k">${kind}</span><b>${h(x.by?pname(x.by):"Tracker")}</b><span class="ago">${agoTxt(Date.parse(x.at))}</span><span class="tx">${h(x.text)}</span></div>`;
}
function rowHTML(a, compact){
  const d = derive(a);
  const flags = [];
  if (d.overdue) flags.push(`<span class="chip red">Late ${diffDays(today(),a.due)}d</span>`);
  else if (d.nbdSlip) flags.push(`<span class="chip amber">NBD passed</span>`);
  if (d.updDue) flags.push(`<span class="chip amber">Update due · ${d.since}d since last</span>`);
  if (d.remDue) flags.push(`<span class="chip blue">Reminder · ${fmt(a.recur.next)}</span>`);
  else if (d.recurring && d.open) flags.push(`<span class="chip">Repeats ${h(freqLabel(a.recur.freq).toLowerCase())}</span>`);
  if (d.open && a.closeRequested) flags.push(`<span class="chip green">Closure requested</span>`);
  if (d.open && a.status==="Blocked") flags.push(`<span class="chip red" ${a.blockedNote?`title="${h(a.blockedNote)}"`:""}>⛔ Blocked</span>`);
  if (S.role==="client" && a.privateToClient) flags.push(`<span class="chip">🔒 Private</span>`);
  else if (a.createdByClient) flags.push(`<span class="chip blue">${S.role==="client"?"Raised by "+h(a.createdBy===S.meId?"you":pname(a.createdBy)):"Raised by client"}</span>`);
  else if (a.sharedWithClient && S.role!=="client") flags.push(`<span class="chip blue">Client-visible</span>`);
  const kids = kidsOf(a);
  if (kids.length){ const dn = kids.filter(k=>CLOSED.includes(k.status)).length; flags.push(`<span class="chip ${dn===kids.length?"green":""}">Sub-tasks ${dn}/${kids.length}</span>`); }
  if (a.parentId) flags.push(`<span class="chip" title="Sub-task of ${h(a.parentTitle||"")}">↳ ${h(a.parentRef||"Main task")}</span>`);
  flags.push(`<span class="chip">${h(a.type||"Action")}</span>`);
  if (S.view.kind!=="container" || !S.view.cl || (S.view.cl && !S.view.tm && a.teamId)) flags.push(`<span class="chip">${h(containerLabel(a))}</span>`);
  const resp = (a.responsible||[]).map(pname).join(", ") || "—";
  const nbd = `<div class="dt c-nbd ${d.nbdSlip?"late":""}">${fmt(a.nbd)}<small>Next best date</small></div>`;
  const due = S.role==="client" && !a.due ? `<div class="dt c-due"></div>` : `<div class="dt c-due ${d.overdue?"late":""}">${fmt(a.due)}<small>Due</small></div>`;
  const dotCls = d.overdue || (d.open && a.status==="Blocked") ? "red" : d.open && (d.nbdSlip || d.updDue) ? "amber" : d.remDue ? "blue" : "";
  const dotTip = flags.map(f=>f.replace(/<[^>]+>/g,"")).join(" · ");
  const actLine = activityHTML(a);
  const body = `<div class="c-t">${""}<div class="t" title="${h(a.title)}${dotTip?" — "+h(dotTip):""}">${isNewFor(a)?`<span class="newdot" title="New update"></span>`:""}${dotCls?`<span class="flagdot ${dotCls}"></span>`:""}${h(a.title)}</div>${a.nba&&d.open?`<div class="nba"><b>NBA</b> ${h(a.nba)}</div>`:""}${!d.open&&a.closureNote?`<div class="nba"><b>Closed</b> ${h(a.closureNote)}</div>`:""}${actLine}<div class="meta">${flags.join("")}</div></div>`;
  if (compact) return `<div class="row ${d.open?"":"closed"}" data-act="open" data-id="${h(a.id)}" tabindex="0"><span class="cobar" style="background:${coColor(a.companyId)}"></span><div class="ref c-ref">${h(a.ref)}</div>${body}<div class="c-pri"><span class="pri ${h(a.priority)}">${h(a.priority)}</span></div><div class="ppl c-ppl"><b>A</b> ${h(pname(a.accountable))} · <b>R</b> ${h(resp)}<br class="l2b"><span class="l2s"> · </span>${S.role==="client"&&!a.due?"":`<span class="${d.overdue?"late":""}">Due ${fmt(a.due)}</span> · `}NBD ${fmt(a.nbd)}</div></div>`;
  return `<div class="row ${d.open?"":"closed"} ${a.parentId&&S.nesting?"sub":""}" data-act="open" data-id="${h(a.id)}" tabindex="0"><span class="cobar" style="background:${coColor(a.companyId)}"></span><div class="ref c-ref">${h(a.ref)}</div>${body}<div class="c-pri"><span class="pri ${h(a.priority)}">${h(a.priority)}</span></div><div class="c-st"><span class="st ${stClass(a.status)}">${h(a.status)}</span></div><div class="ppl c-ppl" title="Accountable: ${h(pname(a.accountable))} · Responsible: ${h(resp)}"><b>A</b> ${h(pname(a.accountable))}<br><b>R</b> ${h(resp)}</div>${nbd}${due}</div>`;
}

function closedPanel(list, showContainer){
  const which = S.closedRange, b = weekBounds(which);
  const items = closedBetween(list.filter(a=>!a.parentId), b); S.closedItems = items; S.closedShowC = showContainer;
  const done = items.filter(a=>a.status==="Done").length, canc = items.length - done;
  const row = a => `<div class="row closedrow" data-act="open" data-id="${h(a.id)}" tabindex="0"><span class="cobar" style="background:${coColor(a.companyId)}"></span><div class="ref c-ref">${h(a.ref)}</div>
    <div class="c-t"><div class="t">${h(a.title)}</div><div class="nba"><b>${a.status==="Done"?"Outcome":"Cancelled"}</b> ${h(a.closureNote||"No closure note recorded")}</div><div class="meta">${a.status==="Done"?`<span class="chip green">Done</span>`:`<span class="chip">Cancelled</span>`}<span class="chip">${h(a.type||"Action")}</span>${showContainer?`<span class="chip">${h(containerLabel(a))}</span>`:""}${a.due && closedDay(a)>a.due?`<span class="chip amber">Closed ${diffDays(closedDay(a),a.due)}d after due</span>`:a.due?`<span class="chip green">On time</span>`:""}</div></div>
    <div class="c-pri"><span class="pri ${h(a.priority)}">${h(a.priority)}</span></div>
    <div class="ppl c-ppl">Closed <b>${fmt(closedDay(a))}</b><br class="l2b"><span class="l2s"> · </span><b>A</b> ${h(pname(a.accountable))} · <b>R</b> ${h((a.responsible||[]).map(pname).join(", ")||"—")}</div></div>`;
  return `<section class="panel"><header><div><h2>Closed ${which==="last"?"last week":"this week"}</h2><span class="sub">${fmt(b.start)} – ${fmt(b.end)} · ${done} done${canc?` · ${canc} cancelled`:""}</span></div>
    <div class="actions"><div class="seg" role="group" aria-label="Period"><button type="button" data-act="crange" data-r="last" class="${which==="last"?"on":""}">Last week</button><button type="button" data-act="crange" data-r="this" class="${which==="this"?"on":""}">This week</button></div>${items.length?`<button class="btn sm" data-act="copyClosed">Copy for update</button>`:""}</div></header>
    ${items.length ? `<div class="att">${items.map(row).join("")}</div>` : `<div class="empty"><b>Nothing closed ${which==="last"?"last week":"so far this week"}</b>Items marked Done or Cancelled, with their closure note, appear here for your update.</div>`}</section>`;
}
async function copyClosed(){
  const b = weekBounds(S.closedRange); const items = S.closedItems;
  const lines = items.map(a=>`- ${a.ref} · ${a.title}${S.closedShowC?` [${containerLabel(a)}]`:""} — ${a.status==="Done"?"":"Cancelled: "}${a.closureNote||"Completed"} (closed ${fmt(closedDay(a))}, owner ${pname(a.accountable)})`);
  const txt = `Closed ${S.closedRange==="last"?"last week":"this week"} (${fmt(b.start)} – ${fmt(b.end)}): ${items.filter(a=>a.status==="Done").length} done\n${lines.join("\n")}`;
  try { await navigator.clipboard.writeText(txt); toast("Closed items copied"); } catch(_){ toast("Copy is blocked here — open an item to copy its note"); }
}
function viewContainer(){
  const v = S.view, c = v.co ? co(v.co) : null; if (v.co && !c) return `<div class="empty">This container no longer exists.</div>`;
  const k = c && v.cl && v.cl!=="_co" ? cl(v.co, v.cl) : null; const t = k && v.tm ? tm(v.co, v.cl, v.tm) : null;
  const title = !c ? "All actions" : t ? `${k.name} · ${t.name} team` : k ? k.name : v.cl==="_co" ? `${c.name} — company-level` : c.name;
  const crumb = !c ? "All three companies" : t ? `${c.name} · ${k.name}` : k ? c.name : "Company";
  const scoped = S.actions.filter(a=>inScope(a,v));
  const f = S.filters;
  let list = scoped.filter(a=>{
    const d = derive(a);
    if (f.status==="open" && !d.open) return false;
    if (f.status==="closed" && d.open) return false;
    if (f.status && !["open","closed","all"].includes(f.status) && a.status!==f.status) return false;
    if (f.priority && a.priority!==f.priority) return false;
    if (f.type && a.type!==f.type) return false;
    if (f.person && !([a.accountable,...(a.responsible||[]),...(a.consulted||[]),...(a.informed||[])].includes(f.person))) return false;
    if (f.flag && a.parentId) return false; // dashboard numbers count main tasks only
    if (f.flag==="overdue" && !d.overdue) return false;
    if (f.flag==="blocked" && !(d.open && a.status==="Blocked")) return false;
    if (f.flag==="p12" && !(d.open && (a.priority==="P1"||a.priority==="P2"))) return false;
    if (f.flag==="due7" && !d.due7) return false;
    if (f.flag==="upd" && !d.updDue) return false;
    if (f.flag==="rem" && !d.remDue) return false;
    if (f.flag==="closedLast"){ const b = weekBounds("last"); const cd = closedDay(a); if (a.status!=="Done" || !(cd>=b.start && cd<=b.end)) return false; }
    if (f.q){ const q = f.q.toLowerCase(); if (![a.ref,a.title,a.description,a.nba].join(" ").toLowerCase().includes(q)) return false; }
    return true;
  });
  list = sortActions(list);
  const peopleIds = [...new Set(scoped.flatMap(a=>[a.accountable,...(a.responsible||[]),...(a.consulted||[]),...(a.informed||[])]).filter(Boolean))];
  const opt = (val, lab, cur) => `<option value="${h(val)}" ${cur===val?"selected":""}>${h(lab)}</option>`;
  const flagNames = {blocked:"Blocked",overdue:"Past due date",p12:"Open P1 / P2",due7:"Due in 7 days",upd:"Updates pending",rem:"Reminders due",closedLast:"Closed last week"};
  const teamsNote = k && k.teams && k.teams.length && !t ? `<span class="sub">Includes ${k.teams.map(x=>h(x.name)).join(" and ")} teams</span>` : "";
  return `<div class="head"><div><div class="crumb">${c?`<span class="dot" style="display:inline-block;background:${coColor(c.id)};margin-right:6px"></span>`:`<a data-act="nav" data-v="overview" style="cursor:pointer;text-decoration:underline">Overall view</a> · `}${h(crumb)}</div><h1>${h(title)}</h1></div>
    <div class="actions">${k && k.clientSharing ? `<span class="chip blue" style="align-self:center">Client receives weekly updates</span>`:""}${densityToggle()}<button class="btn" data-act="present">Present</button>${S.role!=="client"?`<button class="btn" data-act="weeklyHere">Weekly update for this</button>`:""}${canEditMtg({companyId:v.co, clientId:v.cl==="_co"?"":v.cl||"", teamId:v.tm||""})?`<button class="btn" data-act="newMtg">Minutes</button>`:""}${S.canCreate||S.role==="client"?`<button class="btn pri" data-act="new">New action</button>`:""}</div></div>
  ${kpiStrip(stats(scoped), true)}
  <section class="panel">
    <div class="filters">
      <input type="search" class="inp" id="fq" placeholder="Search ref, title, next best action" value="${h(f.q)}" aria-label="Search">
      <select class="inp" id="fstatus" aria-label="Status">${opt("open","Open items",f.status)}${opt("closed","Closed items",f.status)}${opt("all","All items",f.status)}${STATUSES.map(s=>opt(s,s,f.status)).join("")}</select>
      <select class="inp" id="fprio" aria-label="Priority">${opt("","Any priority",f.priority)}${PRIORITIES.map(p=>opt(p.k,p.label,f.priority)).join("")}</select>
      <select class="inp" id="ftype" aria-label="Type">${opt("","Any type",f.type)}${types().map(x=>opt(x,x,f.type)).join("")}</select>
      <select class="inp" id="fperson" aria-label="Person">${opt("","Anyone",f.person)}${peopleIds.map(id=>opt(id,pname(id),f.person)).join("")}</select>
      ${f.flag?`<button class="btn sm" data-act="flag" data-flag="">${h(flagNames[f.flag])} ✕</button>`:""}
      ${teamsNote}
    </div>
    ${list.length ? `<div class="rows"><div class="rowh"><span>Ref</span><span>Action · next best action</span><span>Priority</span><span>Status</span><span>Accountable / Responsible</span><span>NBD</span><span>Due</span></div>${(S.nesting=true, nestKids(list)).map(a=>rowHTML(a,false)).join("")}${(S.nesting=false,"")}</div>`
      : `<div class="empty"><b>${scoped.length?"No items match these filters":"No action items here yet"}</b>${scoped.length?"Change the status or priority filter to see more.":`Log the first action for ${h(title)}${S.canCreate?" with New action":""}.`}</div>`}
  </section>
  ${closedPanel(scoped, !k || !!(k.teams||[]).length && !t)}`;
}

let D = null; // draft
function blankDraft(){
  const v = S.view.kind==="container" ? S.view : {};
  const t = today();
  if (S.role==="client"){
    const coId = allCompanies().find(c=>(c.clients||[]).some(k=>k.id===S.me.clientId))?.id || "";
    return {isNew:true, createdByClient:true, companyId:coId, clientId:S.me.clientId||"", teamId:"", title:"", description:"", type:"Client request", priority:"P3", status:"Not started",
      due:addDays(t,14), nba:"", nbd:addDays(t,3), accountable:S.meId, responsible:[S.meId], consulted:[], informed:[], sharedWithClient:true, recur:{freq:"none", next:"", lead:1}, updateEvery:0};
  }
  return {isNew:true, companyId:v.co||companies()[0]?.id||"", clientId: v.cl && v.cl!=="_co" ? v.cl : "", teamId:v.tm||"",
    title:"", description:"", type:types()[0]||"Deliverable", priority:"P3", status:"Not started", due:addDays(t,7), nba:"", nbd:addDays(t,3),

function openDrawer(id){
  closeComments();
  if (id){ const a = S.actions.find(x=>x.id===id); if(!a) return; markSeen(id); D = JSON.parse(JSON.stringify(a)); D.isNew=false; D.recur = D.recur || {freq:"none",next:"",lead:1}; D._orig = JSON.parse(JSON.stringify(a)); subscribeComments(id); }
  else D = blankDraft();
  renderDrawer();
}
function closeDrawer(){ const had = !!D || !!M; M = null; closeComments(); D = null; $("#drawerHost").innerHTML = ""; if (had && S.structureLoaded && S.actionsLoaded) render(); }
function closeComments(){ if (S.commentsUnsub){ S.commentsUnsub(); S.commentsUnsub=null; } S.comments=[]; }
function subscribeComments(id){
  if (!S.db) return;
  S.commentsUnsub = S.db.doc("actions/"+id).collection("comments").orderBy("at","desc").limit(300).onSnapshot(snap=>{
    S.comments = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderTrail();
  }, e => { const el = $("#trail"); if (el) el.innerHTML = `<div class="hint">Comment trail could not load (${h(e.code)}).</div>`; });
}
const isLong = d => d.due && diffDays(d.due, (d.createdAt||nowISO()).slice(0,10)) > LONG_DAYS;
const clientSharingOn = d => !!cl(d.companyId, d.clientId)?.clientSharing;

function pickerHTML(role, ids){
  const multi = role !== "accountable";
  const sel = multi ? (ids||[]) : (ids ? [ids] : []);
  const chips = sel.map(id=>{ const p = person(id); return `<span class="pchip ${p?.side==="client"?"client":""}">${h(p?.name||"Unknown")}${D._full?`<button type="button" data-act="unpick" data-role="${role}" data-id="${h(id)}" aria-label="Remove ${h(p?.name||"")}">×</button>`:""}</span>`; }).join("");
  const pool = S.people.filter(p=>p.active!==false && !sel.includes(p.id) && (!D.parentId || sameOrgP(p, D.companyId)));
  const rank = p => (p.clientId && p.clientId===D.clientId) ? 0 : (p.companyId===D.companyId || !p.companyId) ? 1 : 2;
  pool.sort((a,b)=>rank(a)-rank(b) || a.name.localeCompare(b.name));
  const opts = pool.map(p=>`<option value="${h(p.id)}">${h(p.name)}${p.role?` — ${h(p.role)}`:""}${p.side==="client"?" (client)":""}</option>`).join("");
  const showSel = D._full && (multi || !sel.length);
  return `<div class="picker" id="pk-${role}">${chips}${showSel?`<select data-pick="${role}" aria-label="Add person"><option value="">${sel.length?"+ add":"Choose person…"}</option>${opts}${S.canCreate&&!D.parentId?`<option value="__new">+ Add someone to the directory…</option>`:""}</select>`:""}</div>`;
}
function containerSelects(){
  const c = co(D.companyId);
  const coOpts = companies().map(x=>`<option value="${h(x.id)}" ${x.id===D.companyId?"selected":""}>${h(x.name)}</option>`).join("");
  const clOpts = `<option value="">Company-level</option>` + (c?.clients||[]).map(x=>`<option value="${h(x.id)}" ${x.id===D.clientId?"selected":""}>${h(x.name)}</option>`).join("");

}
function renderDrawer(){
  if (!D) return;
  const newOK = S.canCreate || S.role==="client";
  D._full = D.isNew ? newOK : canEditA(D._orig||D);
  D._lite = D.isNew ? newOK : canUpdA(D._orig||D);
  const cl_ = S.role==="client", own = cl_ && (D.isNew || isClientOwn(D._orig||D));
  const dis = D._full ? "" : "disabled";
  const disL = D._lite ? "" : "disabled";
  const d = D.isNew ? {open:true} : derive(D);
  const long = isLong(D);
  const opt = (v,l,cur) => `<option value="${h(v)}" ${String(cur)===String(v)?"selected":""}>${h(l)}</option>`;
  const cadOpts = long ? [[3,"Every 3 days"],[7,"Every 7 days"],[14,"Every 14 days"]] : [[0,"Not required"],[3,"Every 3 days"],[7,"Every 7 days"],[14,"Every 14 days"]];
  if (long && !(+D.updateEvery) && D._full) D.updateEvery = 7;
  const share = clientSharingOn(D) && S.role!=="client";
  const hdr = D.isNew ? `<div><div class="crumb">New action</div><h2>Log an action item</h2></div>`
    : `<div><div class="crumb"><span class="mono">${h(D.ref)}</span> · ${h(containerLabel(D))}</div><h2>${h(D.title)}</h2>${D.parentId?`<div class="crumb" style="margin-top:4px">Sub-task of ${masterOf(D)?`<a class="lnk" data-act="open" data-id="${h(D.parentId)}">${h(D.parentRef||"")} · ${h(D.parentTitle||"")}</a>`:`${h(D.parentRef||"")} · ${h(D.parentTitle||"")}`}</div>`:""}</div>`;
  const alerts = [];
  if (cl_ && own){
    const priv = !(D.isNew ? false : !(D._orig||D).privateToClient);
    alerts.push(priv ? `<div class="callout">🔒 <b>Private to you.</b> Only you${D.isNew?"":" and anyone from your organisation you name on it"} can see this item. Assign someone from the team as Accountable or Responsible and it's shared with them.</div>`
      : `<div class="callout" style="background:var(--blue-bg);color:var(--blue);box-shadow:none">Shared with the team: ${h([D.accountable,...(D.responsible||[])].filter((x,i,a)=>x&&a.indexOf(x)===i).map(pname).join(", "))} can see and work on this.</div>`);
  }
  if (!D.isNew && !cl_ && D.createdByClient) alerts.push(`<div class="callout" style="background:var(--blue-bg);color:var(--blue);box-shadow:none">Raised by ${h(pname(D.createdBy))} (client). They see this item and every update marked visible to client. Keep at least one team member on it.</div>`);
  if (!D.isNew){

function subtasksHTML(){

  const t = today(), defDue = m.due && m.due >= t ? (m.due < addDays(t,7) ? m.due : addDays(t,7)) : addDays(t,7);
  const ppl = S.people.filter(p=>sameOrgP(p, m.companyId)).sort((a,b)=>a.name.localeCompare(b.name));

    ${kids.length?`<div class="subs">${rows}</div>`:`<div class="hint">Break this into smaller pieces and assign each one. The main task can only be closed once every sub-task is Done or Cancelled.</div>`}

}

function readForm(){
  if (!D || !D._lite) return;
  const val = id => { const e = $("#"+id); return e ? e.value : undefined; };
  D.title = (val("f-title")||"").trim(); D.description = (val("f-desc")||"").trim();
  D.type = val("f-type"); D.priority = val("f-prio"); D.status = val("f-status");
  D.nba = (val("f-nba")||"").trim(); D.nbd = val("f-nbd")||""; D.due = val("f-due")||"";
  D.updateEvery = +(val("f-cad")||0);

const FIELDS = ["title","description","companyId","clientId","teamId","type","priority","status","due","nba","nbd","accountable","responsible","consulted","informed","sharedWithClient","recur","updateEvery"];
async function saveDraft(){
  readForm();
  const errs = [];
  if (!D.title) errs.push("an action item title");
  if (!D.accountable) errs.push("an Accountable person");
  if (D.isNew && !(D.responsible||[]).length) errs.push("at least one Responsible person");
  if (!CLOSED.includes(D.status) && !D.nba) errs.push("the next best action");
  if (!CLOSED.includes(D.status) && !D.nbd) errs.push("the next best date");
  if (D.recur.freq!=="none" && !D.recur.next) errs.push("the next occurrence date");
  const closing = CLOSED.includes(D.status) && !(D._orig && CLOSED.includes(D._orig.status));
  if (closing && !D.closureNote) errs.push("a closure note");
  if (errs.length){ toast("Add " + errs.join(", ") + "."); return; }
  if (closing && !D.isNew){ const open = kidsOf(D._orig).filter(k=>!CLOSED.includes(k.status)); if (open.length && (D._full || D._orig.accountable===S.meId)){ toast(`Finish the open sub-task${open.length>1?"s":""} first: ${open.map(k=>k.ref).join(", ")}`); return; } }
  if (D._full && isLong(D) && !(+D.updateEvery)) D.updateEvery = 7;
  if (D._full && !clientSharingOn(D)) D.sharedWithClient = false;
  if (!D._full && D._orig) for (const k of ["title","description","companyId","clientId","teamId","type","priority","due","accountable","responsible","consulted","informed","sharedWithClient","updateEvery","recur"]) D[k] = D._orig[k];
  if (closing && !D._full && D._orig && D._orig.accountable!==S.meId){
    try {
      await S.db.doc("actions/"+D.id).update({closeRequested:{by:S.meId, at:nowISO(), note:D.closureNote}, nba:D.nba, nbd:D.nbd, lastUpdateAt:nowISO(), lastUpdateText:`Asked to close: ${D.closureNote}`});
      await addComment(D.id, {kind:"update", text:`Asked ${pname(D._orig.accountable)} to close this: ${D.closureNote}`});
      toast("Closure request sent to the Accountable person"); closeDrawer();
    } catch(e){ toast(writeErr(e)); }
    return;
  }
  const data = {}; for (const k of FIELDS) data[k] = D[k] ?? null;
  if (!D.isNew && D._orig) for (const k of FIELDS) if (D._orig[k] === undefined && data[k] === null) delete data[k];
  const btn = document.querySelector('[data-act="save"]'); if (btn) btn.disabled = true;
  try {
    if (D.isNew){
      data.ref = nextRef(refPrefix(D.companyId, D.clientId, D.teamId));
      data.createdAt = nowISO(); data.createdBy = S.meId; data.lastUpdateAt = null; data.closedAt = null; data.closureNote = "";
      const ref = S.db.collection("actions").doc();
      await ref.set(data);
      await addComment(ref.id, {kind:"system", text:`Created as ${data.priority} · ${data.type}. Accountable: ${pname(data.accountable)}. Responsible: ${data.responsible.map(pname).join(", ")}.${data.due?` Due ${fmt(data.due)}.`:""}`});
      toast(`${data.ref} created`);
      if (S.actions.some(x=>x.id===ref.id)) openDrawer(ref.id); else closeDrawer();
      return;
    }
    const o = D._orig, changes = [];
    if (o.status!==data.status) changes.push(`Status ${o.status} → ${data.status}`);
    if (o.priority!==data.priority) changes.push(`Priority ${o.priority} → ${data.priority}`);
    if (o.due!==data.due) changes.push(`Due date ${fmt(o.due)} → ${fmt(data.due)}`);
    if (o.nbd!==data.nbd) changes.push(`Next best date ${fmt(o.nbd)} → ${fmt(data.nbd)}`);
    if (o.nba!==data.nba) changes.push(`Next best action: ${data.nba}`);
    if (o.accountable!==data.accountable) changes.push(`Accountable ${pname(o.accountable)} → ${pname(data.accountable)}`);
    if (JSON.stringify(o.responsible)!==JSON.stringify(data.responsible)) changes.push(`Responsible: ${data.responsible.map(pname).join(", ")}`);
    const rk = r => r ? [r.freq||"none", r.next||"", +(r.lead??1)].join("|") : "none||1";
    if (rk(o.recur)!==rk(data.recur)) changes.push(data.recur.freq==="none"?"Repeat reminders turned off":`Repeats ${freqLabel(data.recur.freq).toLowerCase()}, next ${fmt(data.recur.next)}`);
    if (!!o.sharedWithClient!==!!data.sharedWithClient) changes.push(data.sharedWithClient?"Now included in client updates":"Removed from client updates");
    if (closing){ data.closeRequested = null; data.closedAt = nowISO(); data.closureNote = D.closureNote; data.lastUpdateAt = nowISO(); data.lastUpdateText = `Closed: ${D.closureNote}`; if (D.sharedWithClient) data.lastClientUpdate = `Closed: ${D.closureNote}`; }
    if (!CLOSED.includes(data.status) && CLOSED.includes(o.status)){ data.closedAt = null; changes.push("Reopened"); }
    await S.db.doc("actions/"+D.id).update(data);
    if (closing) await addComment(D.id, {kind:"update", text:`${data.status==="Done"?"Closed":"Cancelled"}: ${D.closureNote}`, visibleToClient: !!D.sharedWithClient});
    if (changes.length) await addComment(D.id, {kind:"system", text: changes.join("\n")});
    toast(changes.length || closing ? "Saved and logged in the trail" : "Saved");
    if (closing && o.parentId){
      const m = masterOf(o);
      if (m){ await addComment(m.id, {kind:"system", text:`Sub-task ${o.ref} ${data.status==="Done"?"completed":"cancelled"}: ${D.closureNote}`}).catch(()=>{});
        const left = kidsOf(m).filter(k=>k.id!==o.id && !CLOSED.includes(k.status));
        if (!left.length) toast(`All sub-tasks of ${m.ref} are complete — it can be closed now`); }
    }
    closeDrawer();
  } catch(e){ toast(writeErr(e)); if (btn) btn.disabled = false; }
}
function writeErr(e){
  if (e && e.code === "invalid_argument") return e.message || "You don't have permission to change this.";
  if (e && e.code === "quota_exceeded") return "The tracker's storage is full. Delete old cancelled items to make room.";
  return "Could not save — " + (e && e.message || "try again");
}
async function addComment(actionId, c){

}
async function postComment(){

async function cycleDone(){
  const r = D._orig.recur; const done = r.next || today(); const next = addFreq(done, r.freq);
  try {
    await S.db.doc("actions/"+D.id).update({recur:{...r, next}, lastUpdateAt: nowISO(), lastUpdateText:`${D.type} for ${fmt(done)} completed`});
    await addComment(D.id, {kind:"update", text:`Cycle for ${fmt(done)} completed. Next occurrence ${fmt(next)}.`});

  } catch(e){ toast(writeErr(e)); }
}

function scopeOptions(){
  const out = [["all","All companies"]];
  for (const c of companies()){ out.push([`c:${c.id}::`, c.name]); for (const k of c.clients||[]){ out.push([`c:${c.id}:${k.id}:`, `${c.name} · ${k.name}`]); for (const t of k.teams||[]) out.push([`c:${c.id}:${k.id}:${t.id}`, `${c.name} · ${k.name} · ${t.name}`]); } }
  return out;
}
function parseScope(key){ if (key==="all") return {kind:"all"}; const [,c,k,t] = key.split(":"); return {kind:"container", co:c, cl:k||"", tm:t||""}; }
function scopeLabel(key){ return (scopeOptions().find(o=>o[0]===key)||["","All companies"])[1]; }
function scopeAllowsClient(key){ const sc = parseScope(key); return sc.kind==="container" && sc.cl && cl(sc.co, sc.cl)?.clientSharing; }
/* Expenova summaries (weekly email, present mode) leave out due dates */
const NO_DUE_COMPANIES = ["exp"];
const noDue = a => NO_DUE_COMPANIES.includes(a.companyId);
function buildReport(){
  const w = S.wk; const sc = parseScope(w.scope); const end = w.weekEnd || today(); const start = addDays(end,-6);
  const client = w.audience==="client";
  let acts = S.actions.filter(a=>inScope(a,sc) && !a.parentId);
  if (client) acts = acts.filter(a=>a.sharedWithClient);
  const t = today();
  const closed = acts.filter(a=>a.status==="Done" && a.closedAt && closedDay(a)>=start && closedDay(a)<=end).sort((x,y)=>y.closedAt.localeCompare(x.closedAt));
  const openA = sortActions(acts.filter(a=>derive(a).open));
  const overdue = openA.filter(a=>derive(a).overdue);
  const focus = openA.filter(a=>!derive(a).overdue && (a.priority==="P1"||a.priority==="P2"));
  const coming = openA.filter(a=>!derive(a).overdue && !(a.priority==="P1"||a.priority==="P2") && ((a.nbd && a.nbd<=addDays(end,7)) || (a.due && a.due<=addDays(end,7))));
  const created = acts.filter(a=>a.createdAt && a.createdAt.slice(0,10)>=start && a.createdAt.slice(0,10)<=end);
  const pending = client ? [] : openA.filter(a=>derive(a).updDue);
  const recurring = openA.filter(a=>{ const d = derive(a); return d.recurring && a.recur.next && a.recur.next<=addDays(end,7); });
  const multi = sc.kind==="all" || !sc.cl || (!sc.tm && (cl(sc.co,sc.cl)?.teams||[]).length);
  const s = stats(acts);
  const label = scopeLabel(w.scope);
  const upd = a => client ? a.lastClientUpdate : a.lastUpdateText;
  const li = a => { const r = (a.responsible||[]).map(pname).join(", "); const u = upd(a);
    return `<li><b>${h(a.ref)} · ${h(a.title)}</b>${multi?` [${h(containerLabel(a))}]`:""}<br>${h(a.priority)} · ${h(a.status)} · Owner ${h(pname(a.accountable))}${r?` · Doing: ${h(r)}`:""}<br>Next step: ${h(a.nba||"—")} by ${fmt(a.nbd)}${noDue(a)?"":` · Due ${fmt(a.due)}`}${u?`<br>Latest: ${h(u)}`:""}</li>`; };
  const liT = a => { const r = (a.responsible||[]).map(pname).join(", "); const u = upd(a);
    return `- ${a.ref} · ${a.title}${multi?` [${containerLabel(a)}]`:""}\n  ${a.priority} · ${a.status} · Owner ${pname(a.accountable)}${r?` · Doing: ${r}`:""}\n  Next step: ${a.nba||"—"} by ${fmt(a.nbd)}${noDue(a)?"":` · Due ${fmt(a.due)}`}${u?`\n  Latest: ${u}`:""}`; };
  const sec = (title, list, fn=li) => list.length ? `<h3>${h(title)} (${list.length})</h3><ul>${list.map(fn).join("")}</ul>` : "";
  const secT = (title, list) => list.length ? `\n${title.toUpperCase()} (${list.length})\n${list.map(liT).join("\n")}\n` : "";
  const greet = client ? `<p>Dear team,</p><p>Here is this week's status on the open action items between Expenova and ${h(cl(sc.co,sc.cl)?.name||"you")} for the week ${fmt(start)} – ${fmt(end)}.</p>` : `<p>Hi all,</p><p>Weekly action tracker update for <b>${h(label)}</b>, week ${fmt(start)} – ${fmt(end)}.</p>`;
  const table = `<table><tr><th>Open</th><th>Late</th><th>Blocked</th><th>P1/P2</th><th>Closed in period</th><th>New in period</th></tr><tr><td>${s.open}</td><td>${s.overdue}</td><td>${s.blocked}</td><td>${s.p12}</td><td>${closed.length}</td><td>${created.length}</td></tr></table>`;
  const pendLi = a => `<li><b>${h(a.ref)} · ${h(a.title)}</b> — update from ${h((a.responsible||[]).map(pname).join(", ")||"owner")} is ${derive(a).since} days old (asked every ${a.updateEvery} days)</li>`;
  const recLi = a => `<li><b>${h(a.ref)} · ${h(a.title)}</b> — ${h(freqLabel(a.recur.freq).toLowerCase())}, next on ${fmt(a.recur.next)}</li>`;
  const blocked = openA.filter(a=>a.status==="Blocked");
  const blkLi = a => `<li><b>${h(a.ref)} · ${h(a.title)}</b>${multi?` [${h(containerLabel(a))}]`:""}${!client&&a.blockedNote?` — ${h(a.blockedNote)}`:""}<br>Owner ${h(pname(a.accountable))}</li>`;
  let body = `<div><h2>${client?"Weekly status update":"Weekly action update"} — ${h(label)}</h2>${greet}${table}`
    + sec("Closed in this period", closed, a=>`<li><b>${h(a.ref)} · ${h(a.title)}</b>${multi?` [${h(containerLabel(a))}]`:""} — ${h(a.closureNote||"Completed")}<br>Closed ${fmt(closedDay(a))} · Owner ${h(pname(a.accountable))}${a.due&&!noDue(a)?(closedDay(a)>a.due?` · ${diffDays(closedDay(a),a.due)} days after due date`:" · on time"):""}</li>`)
    + sec("Blocked", blocked, blkLi) + sec("Past due date", overdue) + sec("Priority focus (P1/P2)", focus) + sec("Coming up in the next 7 days", coming)
    + sec("Recurring items coming up", recurring, recLi)
    + (pending.length ? `<h3>Updates still pending (${pending.length})</h3><ul>${pending.map(pendLi).join("")}</ul><p>Owners, please post your progress update in the tracker before the next review.</p>` : "")
    + (openA.length||closed.length ? "" : `<p>No open or closed items in this period.</p>`)
    + `<p>${client?"Please reply with any changes in priority or dates.":"Reply on this thread or post in the tracker for any correction."}</p><p>Regards,<br>Amit</p></div>`;
  let text = `${client?"Weekly status update":"Weekly action update"} — ${label}\nWeek ${fmt(start)} – ${fmt(end)}\n\nOpen ${s.open} · Late ${s.overdue} · Blocked ${s.blocked} · P1/P2 ${s.p12} · Closed this week ${closed.length} · New ${created.length}\n`
    + (closed.length?`\nCLOSED IN THIS PERIOD (${closed.length})\n${closed.map(a=>`- ${a.ref} · ${a.title}${multi?` [${containerLabel(a)}]`:""} — ${a.closureNote||"Completed"} (closed ${fmt(closedDay(a))})`).join("\n")}\n`:"")
    + (blocked.length?`\nBLOCKED (${blocked.length})\n${blocked.map(a=>`- ${a.ref} · ${a.title}${!client&&a.blockedNote?` — ${a.blockedNote}`:""}`).join("\n")}\n`:"")
    + secT("Past due date", overdue) + secT("Priority focus (P1/P2)", focus) + secT("Coming up in the next 7 days", coming)
    + (recurring.length?`\nRECURRING ITEMS COMING UP\n${recurring.map(a=>`- ${a.ref} · ${a.title} — next ${fmt(a.recur.next)}`).join("\n")}\n`:"")
    + (pending.length?`\nUPDATES STILL PENDING\n${pending.map(a=>`- ${a.ref} · ${a.title} — ${(a.responsible||[]).map(pname).join(", ")}`).join("\n")}\n`:"")
    + `\nRegards,\nAmit`;
  // recipients
  const involved = [...openA, ...closed];
  const ids = new Set();
  for (const a of involved){ [a.accountable, ...(a.responsible||[]), ...(a.informed||[])].forEach(id=>id&&ids.add(id)); }
  let ppl = [...ids].map(person).filter(p=>p && p.email && p.active!==false);
  if (client) {
    const k = sc.cl; ppl = S.people.filter(p=>p.side==="client" && p.clientId===k && p.email && p.active!==false && (p.getsUpdates!==false));
  } else ppl = ppl.filter(p=>p.side!=="client");
  const to = [...new Set(ppl.map(p=>p.email))];
  const subject = `${client?"Weekly status":"Weekly action update"} — ${label} — w/e ${fmt(end)}`;
  return {body, text, to, subject, counts:{open:s.open, late:s.overdue, closed:closed.length, items: involved.length}};
}

function buildSlides(sc){
  const acts = S.actions.filter(a=>inScope(a,sc) && !a.parentId);
  const s = stats(acts); const lw = weekBounds("last"); const T = scTitle(sc);
  const multi = !sc || !sc.co || !sc.cl || (sc.cl && !sc.tm && (cl(sc.co,sc.cl)?.teams||[]).length);
  const open = sortActions(acts.filter(a=>derive(a).open));

  const focus = open.filter(a=>!derive(a).overdue && (a.priority==="P1"||a.priority==="P2"));
  const coming = open.filter(a=>derive(a).due7 && !(a.priority==="P1"||a.priority==="P2"));
  const upd = open.filter(a=>derive(a).updDue);
  const rem = open.filter(a=>derive(a).remDue);
  const slides = [];
  const stat = (v,k,cls) => `<div class="s-stat ${v?cls:""}"><b>${v}</b><span>${k}</span></div>`;
  slides.push(`<div class="s-kicker">${h(T.sub)} · ${fmt(today())}</div><h1 class="s-hero">${h(T.title)}</h1><div class="s-lede">Weekly action review · last week ${fmt(lw.start)} – ${fmt(lw.end)}</div>
    <div class="s-stats">${stat(s.open,"Open","")}${stat(s.overdue,"Past due","red")}${stat(s.blocked,"Blocked","red")}${stat(s.p12,"Open P1/P2","amber")}${stat(s.closedLast,"Closed last week","green")}${stat(s.upd,"Updates pending","amber")}</div>`);
  // health slide when scope spans several containers
  const rowsFor = [];
  const add = (label, list, lvl, color) => { if (list.length) rowsFor.push({label, list, lvl, color}); };
  for (const c of companies()){
    if (sc && sc.co && sc.co!==c.id) continue;
    const ca = S.actions.filter(a=>a.companyId===c.id);
    if (!sc || !sc.co) add(c.name, ca, 0, coColor(c.id));
    for (const k of c.clients||[]){
      if (sc && sc.cl && sc.cl!==k.id) continue;
      const ka = ca.filter(a=>a.clientId===k.id); add(k.name, ka, 1);
      if (sc && sc.cl) for (const t of k.teams||[]) add(t.name+" team", ka.filter(a=>a.teamId===t.id), 2);
    }

  if (rowsFor.length > 1){
    const ragName = {r:"At risk", a:"Watch", g:"On track"};
    slides.push(`<div class="s-kicker">Health</div><h2 class="s-h">Where each area stands</h2><div class="s-health">${rowsFor.map(r=>{ const x = stats(r.list); const g = rag(r.list);
      return `<div class="s-hrow l${r.lvl}"><span class="s-rag ${g}"></span><span class="s-hl">${r.color?`<span class="dot" style="background:${r.color}"></span>`:""}${h(r.label)}</span><span class="s-hn"><b>${x.open}</b> open</span><span class="s-hn ${x.overdue?"s-red":""}"><b>${x.overdue}</b> late</span><span class="s-hn"><b>${x.closedLast}</b> closed</span><span class="s-hs ${g}">${ragName[g]}</span></div>`; }).join("")}</div>`);
  }
  slides.push(...listSlides("Wins", "Closed last week", closed, "closed", multi, "var(--s-green)"));
  if (!closed.length) slides.push(`<div class="s-kicker" style="color:var(--s-green)">Wins</div><h2 class="s-h">Closed last week</h2><div class="s-empty">Nothing was closed between ${fmt(lw.start)} and ${fmt(lw.end)}.</div>`);
  slides.push(...listSlides("Needs attention", "Past due date", late, "open", multi, "var(--s-red)"));
  slides.push(...listSlides("Focus", "Priority P1 and P2", focus, "open", multi, "var(--s-amber)"));
  slides.push(...listSlides("Next 7 days", "Coming up", coming, "open", multi, "var(--s-blue)"));
  slides.push(...listSlides("Accountability", "Updates still pending", upd, "upd", multi, "var(--s-amber)"));
  slides.push(...listSlides("Recurring", "Repeat reminders due", rem, "rem", multi, "var(--s-blue)"));
  slides.push(`<div class="s-kicker">Next steps</div><h1 class="s-hero sm">Thank you</h1><div class="s-lede">${late.length?`${late.length} item${late.length>1?"s":""} past due · `:""}${upd.length?`${upd.length} update${upd.length>1?"s":""} owed · `:""}next review in one week</div>`);
  return slides;
}
