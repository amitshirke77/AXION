function mtgRecipients(){
  const ids = M.audience==="client" ? M.attendees||[] : (M.attendees||[]).filter(id=>person(id)?.side!=="client");
  const em = ids.map(id=>person(id)?.email).filter(Boolean);
  const guests = String(M.guests||"").split(/[,;\s]+/).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
  return [...new Set([...em, ...guests])];
}
async function saveMtg(quiet){
  readMtg();
  if (!M.title){ toast("Give the meeting a title."); return false; }
  if (!M.date){ toast("Add the meeting date."); return false; }
  const data = {}; for (const f of MTG_FIELDS) data[f] = M[f] ?? null;
  data.status = (M.sentLog||[]).length ? "Sent" : "Draft";
  try {
    if (M.isNew){ const ref = S.db.collection("meetings").doc(); await ref.set(data); M.id = ref.id; M.isNew = false; M.createdBy = S.meId; }
    else await S.db.doc("meetings/"+M.id).update(data);
    if (!quiet) toast("Minutes saved");
    renderMtg(); return true;
  } catch(e){ toast(writeErr(e)); return false; }
}
async function mtgPdf(){
  if (M.isNew || canEditMtg(M)){ if (!(await saveMtg(true))) return; }
  const url = `/api/meetings/${encodeURIComponent(M.id)}/pdf`;
  const w = window.open(url, "_blank");
  if (!w) location.href = url + "?download=1";
}
async function mtgSend(btn){
  if (!(await saveMtg(true))) return;
  const to = $("#ms-to").value, cc = $("#ms-cc").value;
  if (!splitEmails(to).length){ toast("Add at least one recipient email."); return; }
  btn.disabled = true;
  try { await window.trackerApi(`/api/meetings/${encodeURIComponent(M.id)}/send`, {to, cc, subject:$("#ms-subj").value, message:$("#ms-msg").value});
    toast("Minutes emailed with the PDF attached"); M.sentLog = [...(M.sentLog||[]), {at:nowISO(), by:S.meId, to:splitEmails(to), cc:splitEmails(cc)}]; renderMtg(); }
  catch(e){ toast(e.message || "Couldn't send"); btn.disabled = false; }
}
async function mtgNewAction(btn){
  const title = ($("#mn-title").value||"").trim(), who = $("#mn-who").value, due = $("#mn-due").value;
  if (!title){ toast("Name the action."); return; }
  if (!who){ toast("Choose the owner."); return; }
  readMtg(); if (M.isNew && !(await saveMtg(true))) return;
  const t = today();
  const data = {title, description:`Agreed in meeting: ${M.title} (${fmt(M.date)})`, companyId:M.companyId, clientId:M.clientId||"", teamId:M.teamId||"", type:M.type, priority:"P3", status:"Not started",
    due:due||"", nba:title, nbd: due && due < addDays(t,3) ? due : addDays(t,3), accountable:who, responsible:[who], consulted:[], informed:[], sharedWithClient:false, recur:{freq:"none", next:"", lead:1},
    updateEvery: due && diffDays(due, t) > LONG_DAYS ? 7 : 0, source:`MOM ${fmt(M.date)} — ${M.title}`, meetingId:M.id,
    ref: nextRef(refPrefix(M.companyId, M.clientId, M.teamId)), createdAt:nowISO(), createdBy:S.meId, lastUpdateAt:null, closedAt:null, closureNote:""};
  btn.disabled = true;
  try {
    const ref = S.db.collection("actions").doc(); await ref.set(data);
    await addComment(ref.id, {kind:"system", text:`Created from the minutes of “${M.title}” (${fmt(M.date)}). Owner: ${pname(who)}.${due?` Due ${fmt(due)}.`:""}`});
    M.actionIds = [...(M.actionIds||[]), ref.id];
    for (let i=0; i<30 && !S.actions.some(x=>x.id===ref.id); i++) await new Promise(r=>setTimeout(r,100));
    await saveMtg(true); toast(`${data.ref} created and added to the minutes`);
  } catch(e){ toast(writeErr(e)); btn.disabled = false; }
}

/* ---------- system status (admins) ---------- */
const EV_LABEL = {
  "signin":"Signed in", "signin.failed":"Sign-in failed", "signout":"Signed out", "password.changed":"Changed password", "password.reset":"Reset password",
  "password.reset_requested":"Asked for a password reset", "invite.accepted":"Accepted invite", "invite.created":"Invite created", "access.set":"Login access changed",
  "access.removed":"Login removed", "doc.create":"Created", "doc.update":"Edited", "doc.delete":"Deleted", "comment.add":"Posted on", "mail.weekly_update":"Sent weekly update",
  "job.run_now":"Ran job now", "seed.loaded":"Loaded starting data",
};
const STATUS_TABS = [["audit","Activity"],["error,client_error","Errors"],["slow","Slow requests"],["cron","Scheduled jobs"]];
function ago(ms){ const s = Math.max(0, Math.round((Date.now()-ms)/1000)); if (s<60) return s+"s ago"; if (s<3600) return Math.round(s/60)+" min ago"; if (s<86400) return Math.round(s/3600)+" h ago"; return Math.round(s/86400)+" d ago"; }
function stamp(ms){ const d = new Date(ms); return d.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:false}); }
function viewStatus(){
  const st = S.status, tab = S.statusTab || "audit";
  const pill = (c, label) => { if (!c) return ""; const cls = c.ok ? "green" : c.skipped ? "" : "red"; const txt = c.ok ? (c.ms!=null?`OK · ${c.ms} ms`:"OK") : c.skipped ? c.skipped : (c.error||"Failing");
    return `<div class="stc"><span class="lb">${label}</span><span class="chip ${cls}">${h(txt)}</span></div>`; };
  const tile = (v,k,cls) => `<div class="kpi ${v?cls:""}"><span class="v">${v==null?"—":v}</span><span class="k">${k}</span></div>`;
  const job = (j, on, label) => `<div class="stc"><span class="lb">${label}</span><span class="chip ${on?"blue":""}">${on?"Switched on":"Switched off"}</span>${j?`<span class="chip ${j.level==="error"?"red":j.message==="ran"?"green":""}">Last ${h(j.message)} · ${ago(j.at)}</span>`:`<span class="hint">No run recorded yet</span>`}</div>`;
  const body = !st ? `<div class="empty"><b>Checking…</b>Contacting the database and collecting recent activity.</div>` : st.error ? `<div class="banner">${h(st.error)}</div>` : `
    ${st.usage?`<div class="kpis">${tile(st.usage.errors24h,"Server errors · 24h","red")}${tile(st.usage.clientErrors24h,"Browser errors · 24h","amber")}${tile(st.usage.slow24h,"Slow requests · 24h","amber")}${tile(st.usage.activeLast7d,"People signed in · 7d","")}${tile(st.usage.neverSignedIn,"Logins never used","")}${tile(st.usage.actionsOpen,"Open actions","")}</div>`:""}
    <section class="panel"><header><h2>Health</h2><span class="sub">Version ${h(st.version)}${st.region?" · region "+h(st.region):""} · ${h(st.env)} · checked ${ago(S.statusAt)}</span></header>
      <div class="stgrid">${pill(st.checks.database,"Supabase database")}${pill(st.checks.eventsTable,"Monitoring table")}${pill(st.checks.email,"Email (SMTP)")}${pill(st.checks.microsoft,"Microsoft sign-in")}${pill(st.checks.cronSecret,"Scheduled jobs key")}${pill(st.checks.sessionSecret,"Session secret")}</div>
      <div class="settings" style="padding-top:0">${job(st.jobs.lastRequests, st.jobs.requestsEnabled, "Weekday reminders")}${job(st.jobs.lastDigest, st.jobs.digestEnabled, "Monday summary")}
      ${st.checks.eventsTable && !st.checks.eventsTable.ok ? `<span class="hint">The monitoring table is missing: run <b>supabase/01_schema.sql</b> again in the Supabase SQL Editor. The app keeps working; it just can't keep a history.</span>`:""}</div></section>
    <section class="panel"><header><h2>History</h2><div class="seg">${STATUS_TABS.map(([k,l])=>`<button class="${tab===k?"on":""}" data-act="statusTab" data-k="${k}">${l}</button>`).join("")}</div></header>
      <div id="st-events">${eventsHTML(S.statusEvents, tab)}</div></section>`;
  return `<div class="head"><div><div class="crumb">Admins only</div><h1>System status</h1></div>
    <div class="actions">${S.mail?`<button class="btn" data-act="statusRefresh" data-smtp="1">Test email</button>`:""}<button class="btn" data-act="statusRefresh">Refresh</button></div></div>${body}`;
}
function eventsHTML(list, tab){
  if (!list) return `<div class="empty"><b>Loading…</b></div>`;
  if (!list.length) return `<div class="empty"><b>${tab==="audit"?"No activity recorded yet":tab==="slow"?"No slow requests":tab==="cron"?"No scheduled runs yet":"No errors"}</b>${tab.startsWith("error")?"Nice. Server and browser errors will appear here with a reference you can match against the Vercel logs.":"Entries are kept for 180 days."}</div>`;
  return `<div class="evl">${list.map(e=>{
    const who = e.personId ? pname(e.personId) : "";
    let what = "";
    if (e.kind==="audit"){ const d = e.data||{}; what = `${who?`<b>${h(who)}</b> `:e.message.startsWith("signin")?"":"<b>System</b> "}${h(EV_LABEL[e.message]||e.message)}${d.label?` <span class="chip">${h(d.label)}</span>`:""}${d.target?` · ${h(pname(d.target))}`:""}${d.role?` · ${h(d.role)}`:""}${d.reason?` · ${h(d.reason)}`:""}${d.email&&e.message==="signin.failed"?` · ${h(d.email)}`:""}${d.method&&e.message==="signin"?` · ${h(d.method)}`:""}${d.changed&&d.changed.length?`<div class="hint">${h(d.changed.join(", "))}</div>`:""}`; }
    else if (e.kind==="cron") what = `<b>${h(e.path||"job")}</b> ${h(e.message||"")}${e.data&&e.data.sent?` · ${Array.isArray(e.data.sent)?e.data.sent.length:h(e.data.sent)} emailed`:""}${e.data&&e.data.ms!=null?` · ${e.data.ms} ms`:""}`;
    else if (e.kind==="slow") what = `<b>${h(e.path||"")}</b> took ${h(e.message||"")}${who?` · ${h(who)}`:""}`;
    else what = `<span class="chip ${e.kind==="error"?"red":"amber"}">${e.kind==="error"?"Server":"Browser"}</span> <b>${h(e.message||"")}</b><div class="hint">${h(e.path||"")}${who?" · "+h(who):""}</div>${e.data&&e.data.stack?`<details><summary class="hint">Details</summary><pre>${h(e.data.stack)}</pre></details>`:""}`;
    return `<div class="evr ${e.level==="error"?"err":""}"><span class="when" title="${h(new Date(e.at).toISOString())}">${stamp(e.at)}</span><div class="what">${what}</div>${e.requestId?`<span class="ref" title="Request reference: search for it in Vercel → Logs">${h(e.requestId)}</span>`:""}</div>`;
  }).join("")}</div>`;
}
async function loadStatus(force, smtp){
  if (S.statusLoading) return;
  const fresh = S.statusAt && Date.now() - S.statusAt < 30000;
  if (fresh && !force){ return; }
  S.statusLoading = true;
  try {
    const tab = S.statusTab || "audit";
    const [st, ev] = await Promise.all([window.trackerApi("/api/admin/status" + (smtp?"?smtp=1":"")), window.trackerApi("/api/admin/events?limit=100&kinds=" + encodeURIComponent(tab)).catch(()=>({events:[]}))]);
    S.status = st; S.statusEvents = ev.events; S.statusAt = Date.now();
    S.statusAlert = (st.usage && st.usage.errors24h) || 0;
    if (smtp) toast(st.checks.email.ok ? "The mail server accepted the login" : "Email check failed: " + (st.checks.email.error||""));
  } catch(e){ S.status = {error: e.message || "Couldn't load the status"}; S.statusAt = Date.now(); }

  if (S.view.kind==="status") render(); else if (S.structureLoaded && S.actionsLoaded) renderNav();
}

    catch(e){ toast(e.message || "Couldn't save the password"); }
  };
}
async function signOut(){ try { await window.trackerApi("/api/auth/logout", {}); } catch(_){} location.href = "/login"; }

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const hl = ev.target.closest("[data-help]"); if (hl){ ev.preventDefault(); closeDrawer(); helpJump(hl.dataset.help); return; }
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (el.tagName === "INPUT" && act==="setSetting"){ try { await S.db.doc("org/settings").set({...(S.settings||{}), [el.dataset.k]: el.checked}); toast("Setting saved"); } catch(e){ toast(writeErr(e)); } return; }
  if (el.tagName === "INPUT") { if (act==="toggleShare") { const {co:c, cl:k} = el.dataset; await saveStructure(s=>{ const x = s.companies.find(q=>q.id===c).clients.find(q=>q.id===k); x.clientSharing = el.checked; }); } return; }
  switch(act){
    case "nav": { const v = el.dataset.v; if (v==="c") go({kind:"container", co:el.dataset.co, cl:el.dataset.cl||"", tm:el.dataset.tm||""}); else go({kind:v}); break; }
    case "flag": S.filters.flag = el.dataset.flag; if (el.dataset.flag) S.filters.status = "open"; render(); break;
    case "drill": { ev.stopPropagation(); const fl = el.dataset.flag;
      const target = {kind:"container", co:el.dataset.co||"", cl:el.dataset.cl||"", tm:el.dataset.tm||""};
      if (viewKey(target)!==viewKey(S.view)) go(target);
      S.filters = {...S.filters, q:"", priority:"", type:"", person:"", flag: fl==="open" ? "" : fl, status: fl==="closedLast" ? "all" : "open"};
      render(); window.scrollTo(0,0); break; }
    case "statusRefresh": loadStatus(true, el.dataset.smtp==="1"); break;
    case "statusTab": loadStatusTab(el.dataset.k); break;
    case "density": setDensity(el.dataset.c==="1"); break;
    case "new": openDrawer(null); break;
    case "open": openDrawer(el.dataset.id); break;
    case "addSub": addSub(el); break;
    case "newMtg": closeDrawer(); newMtg(); break;
    case "openMtg": openMtg(el.dataset.id); break;
    case "mSave": saveMtg(false); break;
    case "mPdf": mtgPdf(); break;
    case "mSend": mtgSend(el); break;
    case "mNewAct": mtgNewAction(el); break;
    case "mUnatt": readMtg(); M.attendees = (M.attendees||[]).filter(x=>x!==el.dataset.id); renderMtg(); break;
    case "mUnlink": ev.stopPropagation(); readMtg(); M.actionIds = (M.actionIds||[]).filter(x=>x!==el.dataset.id); renderMtg(); break;
    case "mAddAll": { readMtg(); const inC = a => a.companyId===M.companyId && (!M.clientId || a.clientId===M.clientId) && (!M.teamId || a.teamId===M.teamId);
      const add = sortActions(S.actions.filter(a=>inC(a) && !CLOSED.includes(a.status) && !a.parentId && !(M.actionIds||[]).includes(a.id))).map(a=>a.id);
      M.actionIds = [...(M.actionIds||[]), ...add]; renderMtg(); toast(`${add.length} actions added`); break; }
    case "mDel": { if (el.dataset.armed!=="1"){ el.dataset.armed="1"; el.textContent="Press again to delete"; return; }
      try { await S.db.doc("meetings/"+M.id).delete(); toast("Minutes deleted"); closeDrawer(); } catch(e){ toast(writeErr(e)); } break; }
    case "close": closeDrawer(); break;
    case "save": saveDraft(); break;
    case "cycle": cycleDone(); break;
    case "del": delAction(el); break;
    case "post": postComment(); break;
    case "ckind": CKIND = el.dataset.k; el.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===el)); $("#c-text").placeholder = CKIND==="update" ? "Progress since last update, what is next, any blockers" : "Comment or question"; break;
    case "unpick": { readForm(); const r = el.dataset.role, id = el.dataset.id; if (r==="accountable") D.accountable = ""; else D[r] = (D[r]||[]).filter(x=>x!==id); $("#pk-"+r).outerHTML = pickerHTML(r, D[r]); break; }
    case "qaSave": { const r = el.dataset.role; const name = $("#qa-n").value.trim(); if (!name){ toast("Add a name."); return; }
      const email = $("#qa-e").value.trim();
      try { const ref = await S.db.collection("people").add({name, email, role:$("#qa-r").value, side:$("#qa-s").value, companyId:D.companyId, clientId:$("#qa-s").value==="client"?D.clientId:"", teamId:"", active:true});
        S.people.push({id:ref.id, name, email, role:$("#qa-r").value, side:$("#qa-s").value, companyId:D.companyId, clientId:D.clientId});
        if (r==="accountable") D.accountable = ref.id; else D[r] = [...(D[r]||[]), ref.id];
        $("#qa-"+r).remove(); $("#pk-"+r).outerHTML = pickerHTML(r, D[r]); toast(`${name} added`);
      } catch(e){ toast(writeErr(e)); } break; }
    case "qaCancel": $("#qa-"+el.dataset.role)?.remove(); break;
    case "weeklyHere": { const v = S.view; S.wk.scope = v.co ? `c:${v.co}:${v.cl==="_co"?"":v.cl||""}:${v.tm||""}` : "all"; S.wk.toTouched = S.wk.subjTouched = false; S.wk.audience = scopeAllowsClient(S.wk.scope) ? S.wk.audience : "internal"; go({kind:"weekly"}); break; }
    case "aud": if (el.disabled) return; S.wk.audience = el.dataset.a; S.wk.toTouched = S.wk.subjTouched = false; render(); break;
    case "outlook": outlookDraft(el); break;
    case "copyw": copyWeekly(); break;
    case "account": openAccount(); break;
    case "signout": signOut(); break;
    case "saveAccess": saveAccess(); break;
    case "invite": invite(el.dataset.send === "1"); break;
    case "copyLink": { const t = $("#acc-link").textContent; try { await navigator.clipboard.writeText(t); toast("Link copied"); } catch(_){ const rg = document.createRange(); rg.selectNodeContents($("#acc-link")); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); toast("Press Ctrl/⌘+C to copy"); } break; }
    case "runJob": runJob(el); break;
    case "present": openPresent(); break;
    case "pclose": closePresent(); break;
    case "pnext": stepSlide(1); break;
    case "pprev": stepSlide(-1); break;
    case "pgo": P.i = +el.dataset.i; renderSlide(); break;
    case "pfull": { const n = document.querySelector(".present"); try { if (document.fullscreenElement) await document.exitFullscreen(); else await n.requestFullscreen(); } catch(_){ toast("Full screen isn't available here"); } setTimeout(fitStage,80); break; }
    case "crange": S.closedRange = el.dataset.r; render(); break;
    case "copyClosed": copyClosed(); break;
    case "lastwk": S.wk.weekEnd = weekBounds("last").end; S.wk.subjTouched = false; render(); break;
    case "editp": S.setup.editPerson = el.dataset.id; render(); window.scrollTo(0,0); break;
    case "cancelp": S.setup.editPerson = null; render(); break;
    case "savep": savePerson(); break;
    case "addClient": { const c = el.dataset.co; const name = $("#nc-"+c).value.trim(); const code = ($("#ncc-"+c).value.trim()||name.slice(0,4)).toUpperCase().replace(/[^A-Z0-9]/g,""); if (!name){ toast("Add the client name."); return; }
      await saveStructure(s=>{ const x = s.companies.find(q=>q.id===c); x.clients = x.clients||[]; x.clients.push({id:slug(name), name, code, clientSharing:false, teams:[]}); }); break; }
    case "addTeam": { const {co:c, cl:k} = el.dataset; const row = el.parentElement; if (row.querySelector(".tminp")) return;
      row.insertAdjacentHTML("beforeend", `<input class="inp tminp" placeholder="Team name" style="width:130px"><button class="btn sm pri" data-act="addTeamGo" data-co="${h(c)}" data-cl="${h(k)}">Add</button>`); row.querySelector(".tminp").focus(); break; }
    case "addTeamGo": { const {co:c, cl:k} = el.dataset; const name = el.parentElement.querySelector(".tminp").value.trim(); if (!name) return;
      await saveStructure(s=>{ const x = s.companies.find(q=>q.id===c).clients.find(q=>q.id===k); x.teams = x.teams||[]; x.teams.push({id:slug(name), name, code:name.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5)}); }); break; }
    case "addType": { const t = $("#nt").value.trim(); if (!t) return; await saveStructure(s=>{ if(!s.types.includes(t)) s.types.push(t); }); break; }
    case "delType": { const t = el.dataset.t; await saveStructure(s=>{ s.types = s.types.filter(x=>x!==t); }); break; }
  }
});
document.addEventListener("keydown", ev => {
  if (P){ if (["ArrowRight","PageDown"," "].includes(ev.key)){ ev.preventDefault(); stepSlide(1); } else if (["ArrowLeft","PageUp"].includes(ev.key)){ ev.preventDefault(); stepSlide(-1); } else if (ev.key==="Escape" && !document.fullscreenElement) closePresent(); else if (ev.key==="Home"){ P.i=0; renderSlide(); } else if (ev.key==="End"){ P.i=P.slides.length-1; renderSlide(); } return; }
  if (ev.key==="Escape" && D) closeDrawer();
  if (ev.key==="Enter" && ev.target.matches(".row[data-act=open]")) openDrawer(ev.target.dataset.id);
});
let qT;
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id==="fq"){ clearTimeout(qT); qT = setTimeout(()=>{ S.filters.q = t.value; const pos = t.selectionStart; render(); const n = $("#fq"); if(n){ n.focus(); n.setSelectionRange(pos,pos);} }, 250); }
  if (t.id==="hq"){ S.helpQ = t.value; const b = $("#helpBody"); if (b) b.innerHTML = helpBody(); }
  if (t.id==="w-to"){ S.wk.to = t.value; S.wk.toTouched = true; }
  if (t.id==="w-cc"){ S.wk.cc = t.value; }
  if (t.id==="w-subj"){ S.wk.subject = t.value; S.wk.subjTouched = true; }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  const fmap = {fstatus:"status", fprio:"priority", ftype:"type", fperson:"person"};
  if (fmap[t.id]){ S.filters[fmap[t.id]] = t.value; render(); return; }
  if (t.id==="mobsel"){ const v = t.value; if (v.startsWith("c:")){ const [,c,k,m] = v.split(":"); go({kind:"container", co:c, cl:k, tm:m}); } else go({kind:v}); return; }
  if (t.id==="acc-role"){ const v = t.value; $("#acc-help").textContent = ROLE_HELP[v]; $("#acc-scopes-wrap").hidden = !["editor","contributor"].includes(v); return; }
  if (t.id==="w-scope"){ S.wk.scope = t.value; S.wk.toTouched = S.wk.subjTouched = false; render(); return; }
  if (t.id==="w-end"){ S.wk.weekEnd = t.value || today(); S.wk.subjTouched = false; render(); return; }
  if (M){
    if (t.dataset.matt){ const id = t.value; if (!id) return; readMtg(); M.attendees = [...(M.attendees||[]), id]; renderMtg(); return; }
    if (t.id==="m-co"){ readMtg(); M.companyId = t.value; M.clientId = ""; M.teamId = ""; renderMtg(); return; }
    if (t.id==="m-cl"){ readMtg(); M.clientId = t.value; M.teamId = ""; if (!cl(M.companyId,M.clientId)?.clientSharing) M.audience = "internal"; renderMtg(); return; }
    if (t.id==="m-tm"){ readMtg(); M.teamId = t.value; renderMtg(); return; }
    if (t.id==="m-addex"){ const id = t.value; if (!id) return; readMtg(); M.actionIds = [...(M.actionIds||[]), id]; renderMtg(); return; }
    if (t.name==="m-aud"){ readMtg(); renderMtg(); return; }
    return;
  }
  if (!D) return;
  if (t.dataset.pick){ const r = t.dataset.pick, id = t.value; if (!id) return; if (id==="__new"){ t.value=""; quickAddPerson(r); return; } readForm(); if (r==="accountable") D.accountable = id; else D[r] = [...(D[r]||[]), id]; $("#pk-"+r).outerHTML = pickerHTML(r, D[r]); return; }
  if (t.id==="f-co"){ readForm(); D.companyId = t.value; D.clientId = ""; D.teamId = ""; renderDrawer(); return; }
  if (t.id==="f-cl"){ readForm(); D.clientId = t.value; D.teamId = ""; renderDrawer(); return; }
  if (t.id==="f-tm"){ D.teamId = t.value; return; }
  if (t.id==="f-status"){ const closing = CLOSED.includes(t.value) && !(D._orig && CLOSED.includes(D._orig.status)); $("#closureWrap").hidden = !closing; if (closing) $("#f-closure").focus(); return; }
  if (t.id==="f-type" && D.isNew){ const f = TYPE_FREQ[t.value]; if (f && $("#f-freq").value==="none"){ readForm(); D.type = t.value; D.recur = {freq:f, next:D.nbd||today(), lead:1}; renderDrawer(); } return; }
  if (t.id==="f-freq"){ const on = t.value!=="none"; $("#nextWrap").hidden = !on; $("#leadWrap").hidden = !on; if (on && !$("#f-next").value) $("#f-next").value = $("#f-nbd").value || today(); return; }
  if (t.id==="f-due"){ readForm(); renderDrawer(); return; }
});

/* ---------- boot ---------- */
async function boot(){
  try { S.me = await window.trackerApi("/api/auth/me"); } catch(e){ if (e && e.status===401) return; S.err = "The tracker could not load. Reload to try again."; S.structureLoaded = S.actionsLoaded = true; render(); return; }
  S.db = window.trackerDb; S.meId = S.me.personId; S.role = S.me.role;
  document.body.classList.toggle("client", S.role==="client");
  S.canWrite = S.role!=="client"; S.canAdmin = S.role==="admin"; S.canCreate = S.role==="admin" || S.role==="editor";
  S.mail = !!S.me.mailEnabled; S.mailOK = S.mail && S.canCreate;
  try { S.compact = localStorage.getItem("axion.compact") === "1"; } catch(_){ S.compact = false; }
  document.body.classList.toggle("compact", !!S.compact);
  if (S.canAdmin) setTimeout(()=>loadStatus(true), 2500); // fills the error badge on "System status"
  const db = S.db;
  const fail = e => { if (e && e.code==="revoked") return; S.err = "The tracker could not load (" + (e && e.message || "error") + "). Reload to try again."; render(); };
  db.doc("org/structure").onSnapshot(snap=>{ S.structure = snap.exists ? snap.data() : {companies:[], types:["Ad-hoc meeting","Deliverable"]}; S.structureLoaded = true; if (S.role==="client") S.clientName = allCompanies().flatMap(c=>c.clients||[]).find(k=>k.id===S.me.clientId)?.name || ""; dataRender(); }, fail);
  db.collection("people").onSnapshot(snap=>{ S.people = snap.docs.map(d=>({id:d.id, ...d.data()})); dataRender(); }, fail);
  db.collection("actions").onSnapshot(snap=>{ S.actions = snap.docs.map(d=>({id:d.id, ...d.data()})); const first = !S.actionsLoaded; S.actionsLoaded = true; dataRender(); if (first) openFromHash(); }, fail);
  if (S.role!=="client") db.collection("meetings").onSnapshot(snap=>{ S.meetings = snap.docs.map(d=>({id:d.id, ...d.data()})); if (S.view.kind==="meetings") dataRender(); if (M && !M.isNew){ const f = S.meetings.find(x=>x.id===M.id); if (f) M.sentLog = f.sentLog||[]; } }, ()=>{});
  if (S.role!=="client") db.collection("updates").orderBy("at","desc").limit(40).onSnapshot(snap=>{ S.updates = snap.docs.map(d=>d.data()); if (S.view.kind==="weekly") dataRender(); }, ()=>{});
  if (S.canAdmin){ db.doc("org/settings").onSnapshot(snap=>{ S.settings = snap.exists ? snap.data() : {}; if (S.view.kind==="setup") dataRender(); }, ()=>{}); loadUsers(); }
}
/* Re-render on data changes, but never while someone is typing in a form on the page */
function dataRender(){
  const a = document.activeElement;
  if (a && a.closest && a.closest("#main") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=="search"){ S.pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", ()=> setTimeout(()=>{ if (S.pendingRender){ const a = document.activeElement; if (!(a && a.closest && a.closest("#main") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){ S.pendingRender = false; render(); } } }, 50));
function openFromHash(){
  if (location.hash==="#help" || location.hash.startsWith("#help-")){ const id = location.hash.slice(6); go({kind:"help"}); if (id) setTimeout(()=>helpJump(id), 50); history.replaceState(null, "", location.pathname); return; }
  const m = location.hash.match(/^#item-([A-Za-z0-9_\-.~:@+]+)$/);
  if (m && S.actions.some(a=>a.id===m[1])) openDrawer(m[1]);
  if (m) history.replaceState(null, "", location.pathname);
}
window.addEventListener("hashchange", ()=>{ if (S.actionsLoaded) openFromHash(); });
async function loadUsers(){ try { const r = await window.trackerApi("/api/admin/users"); S.users = r.users; if (S.view.kind==="setup") dataRender(); } catch(_){} }
render();
boot();
})();
